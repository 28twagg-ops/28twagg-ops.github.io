<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dig Dug Delve</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:ui-monospace,Consolas,monospace}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:5px 12px;font-size:13px;font-weight:700;color:#fff;background:rgba(0,0,0,.45);text-shadow:0 0 6px #000;pointer-events:none}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.82)}
#overlay.hidden{display:none}
.card{background:rgba(8,12,24,.96);border:2px solid #ffd95c;border-radius:10px;padding:22px 26px;color:#ffe7a1;max-width:420px;text-align:center}
.card h1{margin:0 0 8px;font-size:27px;letter-spacing:2px;color:#ffd95c}
.card p{margin:5px 0;font-size:13px}
.card button{margin-top:12px;padding:10px 22px;border:2px solid #ffd95c;background:#2b1a05;color:#ffd95c;font:inherit;font-weight:700;border-radius:5px;cursor:pointer}
.card button:hover{background:#3a2207}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="hScore">SCORE 0</div>
  <div id="hRound">ROUND 1</div>
  <div id="hLives">LIVES ♥♥♥</div>
</div>
<div id="overlay">
  <div class="card">
    <h1>DIG DUG DELVE</h1>
    <p>Dig tunnels and pop enemies with your pump.</p>
    <p>Move: Arrow keys / WASD</p>
    <p>Pump: Space or Enter</p>
    <p>Watch for Fygar fire and falling rocks.</p>
    <button id="btn">START DIGGING</button>
  </div>
</div>
<script>
(() => {
"use strict";

const cv = document.getElementById("c");
const cx = cv.getContext("2d");
const overlay = document.getElementById("overlay");
const btn = document.getElementById("btn");
const hScore = document.getElementById("hScore");
const hRound = document.getElementById("hRound");
const hLives = document.getElementById("hLives");

let W = 800, H = 600;
const COLS = 28, ROWS = 20;
let cell = 24, ox = 0, oy = 0;

let running = false, posted = false;
let score = 0, round = 1, lives = 3;
let last = 0;
let keys = {};
let fireFx = [], particles = [], pumps = [];

let dirt = [];
let rocks = [];
let enemies = [];

const P = {
  x: 2, y: 2, dir: "right",
  moveCd: 0, pumpCd: 0, inv: 0
};

function resize() {
  const r = cv.getBoundingClientRect();
  W = Math.max(520, Math.floor(r.width));
  H = Math.max(400, Math.floor(r.height));
  cv.width = W; cv.height = H;
  cell = Math.floor(Math.min(W / COLS, H / ROWS));
  ox = Math.floor((W - COLS * cell) / 2);
  oy = Math.floor((H - ROWS * cell) / 2);
}

function resetDirt() {
  dirt = Array.from({ length: ROWS }, (_, y) =>
    Array.from({ length: COLS }, (_, x) => {
      // Keep top strip mostly clear (classic style)
      if (y < 2) return false;
      // Layer color depth by row in draw
      return true;
    })
  );
  // Player spawn tunnel
  for (let y = 0; y < 4; y++) dirt[y][2] = false;
}

function spawnRound() {
  resetDirt();
  rocks = [];
  enemies = [];
  fireFx = [];
  pumps = [];
  particles = [];

  // Place rocks in dirt regions
  const rockCount = Math.min(8, 4 + round);
  for (let i = 0; i < rockCount; i++) {
    const rx = 5 + ((Math.random() * (COLS - 10)) | 0);
    const ry = 4 + ((Math.random() * (ROWS - 8)) | 0);
    rocks.push({ x: rx, y: ry, falling: false, fy: 0 });
  }

  // Spawn enemies
  const enemyCount = Math.min(12, 4 + round * 2);
  for (let i = 0; i < enemyCount; i++) {
    const type = (i % 3 === 0) ? "fygar" : "pooka";
    const ex = 7 + ((Math.random() * (COLS - 9)) | 0);
    const ey = 4 + ((Math.random() * (ROWS - 6)) | 0);
    enemies.push({
      x: ex, y: ey, tx: ex, ty: ey,
      type, dir: ["left","right","up","down"][(Math.random()*4)|0],
      moveCd: 0, pump: 0, ghost: 0,
      fireCd: 900 + Math.random() * 2200
    });
  }

  P.x = 2; P.y = 1; P.dir = "right"; P.moveCd = 0; P.pumpCd = 0; P.inv = 0;
}

function resetGame() {
  score = 0; round = 1; lives = 3; posted = false;
  spawnRound();
  running = true;
  overlay.classList.add("hidden");
  btn.textContent = "PLAY AGAIN";
}

function nextRound() {
  round++;
  spawnRound();
}

function submit() {
  if (posted) return;
  posted = true;
  try { window.parent.postMessage({ type: "GAME_OVER_SCORE", score: Number(score) || 0 }, "*"); } catch(_) {}
}

function gameOver() {
  running = false;
  submit();
  overlay.classList.remove("hidden");
}

function loseLife() {
  if (P.inv > 0) return;
  lives--;
  P.inv = 1800;
  for (let i = 0; i < 20; i++) {
    const a = Math.random() * Math.PI * 2, s = 1 + Math.random() * 3;
    particles.push({ x:P.x+0.5, y:P.y+0.5, vx:Math.cos(a)*s*0.05, vy:Math.sin(a)*s*0.05, life:1, col:"#ff8877" });
  }
  if (lives <= 0) { gameOver(); return; }
  P.x = 2; P.y = 1;
}

function inBounds(x,y){ return x>=0 && y>=0 && x<COLS && y<ROWS; }
function isDirt(x,y){ return inBounds(x,y) ? dirt[y][x] : false; }
function clearDirt(x,y){
  if (!inBounds(x,y)) return;
  if (dirt[y][x]) {
    dirt[y][x] = false;
    score += 10;
  }
}

function rockAt(x,y){ return rocks.find(r => Math.round(r.x)===x && Math.round(r.y)===y); }

function tryMovePlayer(dx,dy) {
  const nx = P.x + dx, ny = P.y + dy;
  if (!inBounds(nx,ny)) return;
  if (rockAt(nx,ny)) return;
  P.x = nx; P.y = ny;
  clearDirt(nx,ny);
}

function pump() {
  if (P.pumpCd > 0) return;
  P.pumpCd = 170;
  let dx = 0, dy = 0;
  if (P.dir === "left") dx = -1;
  else if (P.dir === "right") dx = 1;
  else if (P.dir === "up") dy = -1;
  else dy = 1;

  for (let i = 1; i <= 3; i++) {
    const tx = P.x + dx * i, ty = P.y + dy * i;
    if (!inBounds(tx,ty)) break;
    if (isDirt(tx,ty)) break;
    pumps.push({ x:tx, y:ty, life:120 });
    const e = enemies.find(en => Math.round(en.x)===tx && Math.round(en.y)===ty);
    if (e) {
      e.pump++;
      if (e.pump >= 4) {
        const bonus = e.type === "fygar" ? 300 : 200;
        score += bonus;
        for (let p = 0; p < 16; p++) {
          const a = Math.random()*Math.PI*2, s=0.05+Math.random()*0.1;
          particles.push({ x:e.x+0.5, y:e.y+0.5, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:1, col:e.type==="fygar"?"#66ff88":"#ff6688" });
        }
        enemies.splice(enemies.indexOf(e), 1);
      }
      break;
    }
  }
}

function enemyStep(e) {
  // Deflate pump
  if (e.pump > 0 && Math.random() < 0.015) e.pump--;

  const dirs = [
    {d:"left",dx:-1,dy:0},{d:"right",dx:1,dy:0},
    {d:"up",dx:0,dy:-1},{d:"down",dx:0,dy:1}
  ];

  // Sometimes ghost through dirt
  if (Math.random() < 0.01 + round * 0.001) e.ghost = 700 + Math.random()*500;
  if (e.ghost > 0) e.ghost -= 30;

  const options = dirs.filter(v => {
    const nx = Math.round(e.x) + v.dx, ny = Math.round(e.y) + v.dy;
    if (!inBounds(nx,ny)) return false;
    if (rockAt(nx,ny)) return false;
    if (e.ghost > 0) return true;
    return !isDirt(nx,ny);
  });
  if (!options.length) return;

  // Bias toward player
  options.sort((a,b) => {
    const da = Math.abs((Math.round(e.x)+a.dx)-P.x)+Math.abs((Math.round(e.y)+a.dy)-P.y);
    const db = Math.abs((Math.round(e.x)+b.dx)-P.x)+Math.abs((Math.round(e.y)+b.dy)-P.y);
    return da - db;
  });
  const pick = Math.random() < 0.7 ? options[0] : options[(Math.random()*options.length)|0];
  e.dir = pick.d;
  e.x += pick.dx;
  e.y += pick.dy;
}

function updateRocks() {
  for (const r of rocks) {
    const rx = Math.round(r.x), ry = Math.round(r.y);
    const belowY = ry + 1;
    if (!inBounds(rx, belowY)) continue;
    const emptyBelow = !isDirt(rx,belowY) && !rockAt(rx,belowY);

    if (emptyBelow) {
      r.falling = true;
      r.fy += 0.18;
      r.y += r.fy * 0.08;
      // Crush enemies
      for (let i = enemies.length-1; i>=0; i--) {
        const e = enemies[i];
        if (Math.abs(e.x - r.x) < 0.45 && Math.abs(e.y - r.y) < 0.8) {
          score += 450;
          enemies.splice(i,1);
        }
      }
      // Hit player
      if (Math.abs(P.x - r.x) < 0.45 && Math.abs(P.y - r.y) < 0.8) loseLife();
    } else {
      r.falling = false;
      r.fy = 0;
      r.y = Math.round(r.y);
    }
  }
}

function update(dt) {
  const ms = Math.min(dt, 40);
  if (P.inv > 0) P.inv -= ms;
  if (P.moveCd > 0) P.moveCd -= ms;
  if (P.pumpCd > 0) P.pumpCd -= ms;

  for (let i = pumps.length - 1; i >= 0; i--) {
    pumps[i].life -= ms;
    if (pumps[i].life <= 0) pumps.splice(i,1);
  }

  // Player movement on grid cadence
  if (P.moveCd <= 0) {
    let moved = false;
    if (keys["arrowleft"] || keys["a"]) { P.dir = "left";  tryMovePlayer(-1,0); moved = true; }
    else if (keys["arrowright"] || keys["d"]) { P.dir = "right"; tryMovePlayer(1,0); moved = true; }
    else if (keys["arrowup"] || keys["w"]) { P.dir = "up";    tryMovePlayer(0,-1); moved = true; }
    else if (keys["arrowdown"] || keys["s"]) { P.dir = "down";  tryMovePlayer(0,1); moved = true; }
    if (moved) P.moveCd = 85;
  }

  // Enemy updates
  for (const e of enemies) {
    e.moveCd -= ms;
    if (e.moveCd <= 0) {
      e.moveCd = Math.max(90, 240 - round * 12);
      enemyStep(e);
    }

    // Fygar fire
    if (e.type === "fygar") {
      e.fireCd -= ms;
      if (e.fireCd <= 0 && Math.random() < 0.45) {
        e.fireCd = 1300 + Math.random() * 2200;
        const d = e.dir === "left" || e.dir === "right" ? e.dir : (Math.random()<0.5?"left":"right");
        let dx = d === "left" ? -1 : 1;
        let len = 0;
        for (let i = 1; i <= 3; i++) {
          const tx = Math.round(e.x) + dx * i, ty = Math.round(e.y);
          if (!inBounds(tx,ty) || isDirt(tx,ty) || rockAt(tx,ty)) break;
          len = i;
        }
        if (len > 0) fireFx.push({ x:Math.round(e.x), y:Math.round(e.y), dir:d, len, life:420 });
      }
    }
  }

  // Resolve enemy collision with player
  for (const e of enemies) {
    if (Math.abs(e.x - P.x) < 0.45 && Math.abs(e.y - P.y) < 0.45) loseLife();
  }

  // Fire fx update
  for (let i = fireFx.length - 1; i >= 0; i--) {
    const f = fireFx[i];
    f.life -= ms;
    const dx = f.dir === "left" ? -1 : 1;
    for (let s = 1; s <= f.len; s++) {
      const fx = f.x + dx * s;
      if (Math.abs(P.x - fx) < 0.45 && Math.abs(P.y - f.y) < 0.35) loseLife();
    }
    if (f.life <= 0) fireFx.splice(i,1);
  }

  updateRocks();

  // Particle update
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.0006 * ms;
    p.life -= 0.015 * (ms / 16);
    if (p.life <= 0) particles.splice(i,1);
  }

  if (!enemies.length) nextRound();

  hScore.textContent = "SCORE " + score;
  hRound.textContent = "ROUND " + round;
  hLives.textContent = "LIVES " + "♥".repeat(Math.max(0,lives)) + "♡".repeat(Math.max(0,3-lives));
}

function drawDirtCell(x,y) {
  const depth = y / ROWS;
  const r = Math.floor(92 + depth * 60);
  const g = Math.floor(45 + depth * 20);
  const b = Math.floor(20 + depth * 5);
  cx.fillStyle = `rgb(${r},${g},${b})`;
  cx.fillRect(ox + x * cell, oy + y * cell, cell, cell);
}

function draw() {
  cx.fillStyle = "#05070a";
  cx.fillRect(0,0,W,H);

  // Background grid glow
  cx.strokeStyle = "rgba(255,255,255,.03)";
  for (let x = 0; x <= COLS; x++) {
    cx.beginPath();
    cx.moveTo(ox + x * cell, oy);
    cx.lineTo(ox + x * cell, oy + ROWS * cell);
    cx.stroke();
  }
  for (let y = 0; y <= ROWS; y++) {
    cx.beginPath();
    cx.moveTo(ox, oy + y * cell);
    cx.lineTo(ox + COLS * cell, oy + y * cell);
    cx.stroke();
  }

  // Dirt
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (dirt[y][x]) drawDirtCell(x,y);
  }

  // Rocks
  for (const r of rocks) {
    cx.fillStyle = "#8d959f";
    cx.beginPath();
    cx.arc(ox + (r.x + 0.5) * cell, oy + (r.y + 0.5) * cell, cell * 0.42, 0, Math.PI*2);
    cx.fill();
    cx.fillStyle = "rgba(255,255,255,.2)";
    cx.beginPath();
    cx.arc(ox + (r.x + 0.36) * cell, oy + (r.y + 0.34) * cell, cell * 0.12, 0, Math.PI*2);
    cx.fill();
  }

  // Pump effects
  for (const p of pumps) {
    cx.strokeStyle = "#ffe36e";
    cx.lineWidth = 2;
    cx.beginPath();
    cx.arc(ox + (p.x + 0.5) * cell, oy + (p.y + 0.5) * cell, cell * 0.20, 0, Math.PI*2);
    cx.stroke();
  }

  // Fire effects
  for (const f of fireFx) {
    const dx = f.dir === "left" ? -1 : 1;
    for (let i = 1; i <= f.len; i++) {
      const fx = f.x + dx * i;
      const px = ox + (fx + 0.5) * cell;
      const py = oy + (f.y + 0.5) * cell;
      cx.fillStyle = i === f.len ? "#ffd14b" : "#ff6a2e";
      cx.beginPath();
      cx.arc(px, py, cell * (0.16 + Math.sin((Date.now()+i*50)*0.02)*0.02), 0, Math.PI*2);
      cx.fill();
    }
  }

  // Enemies
  for (const e of enemies) {
    const px = ox + (e.x + 0.5) * cell;
    const py = oy + (e.y + 0.5) * cell;
    const inf = e.pump * 0.08;
    const rr = cell * (0.34 + inf);
    cx.fillStyle = e.type === "fygar" ? "#4ee07a" : "#ff6b8a";
    cx.beginPath(); cx.arc(px,py,rr,0,Math.PI*2); cx.fill();
    cx.fillStyle = "#111";
    cx.beginPath(); cx.arc(px - rr*0.25, py - rr*0.18, rr*0.12, 0, Math.PI*2); cx.fill();
    cx.beginPath(); cx.arc(px + rr*0.25, py - rr*0.18, rr*0.12, 0, Math.PI*2); cx.fill();
    if (e.ghost > 0) {
      cx.strokeStyle = "rgba(180,220,255,.5)";
      cx.lineWidth = 2;
      cx.beginPath(); cx.arc(px,py,rr+2,0,Math.PI*2); cx.stroke();
    }
  }

  // Player
  if (!(P.inv > 0 && Math.floor(P.inv / 120) % 2 === 0)) {
    const px = ox + (P.x + 0.5) * cell;
    const py = oy + (P.y + 0.5) * cell;
    cx.fillStyle = "#ffd95c";
    cx.beginPath(); cx.arc(px,py,cell*0.34,0,Math.PI*2); cx.fill();
    cx.fillStyle = "#ff7043";
    cx.fillRect(px - cell*0.15, py - cell*0.38, cell*0.3, cell*0.2);
    cx.fillStyle = "#222";
    cx.beginPath(); cx.arc(px - cell*0.1, py - cell*0.1, cell*0.05, 0, Math.PI*2); cx.fill();
    cx.beginPath(); cx.arc(px + cell*0.1, py - cell*0.1, cell*0.05, 0, Math.PI*2); cx.fill();
  }

  // Particles
  for (const p of particles) {
    cx.globalAlpha = Math.max(0,p.life);
    cx.fillStyle = p.col;
    cx.fillRect(ox + p.x * cell, oy + p.y * cell, 2, 2);
  }
  cx.globalAlpha = 1;

  // Border
  cx.strokeStyle = "rgba(255,220,120,.28)";
  cx.lineWidth = 2;
  cx.strokeRect(ox - 1, oy - 1, COLS * cell + 2, ROWS * cell + 2);
}

function loop(ts) {
  if (!last) last = ts;
  const dt = ts - last; last = ts;
  if (running) update(dt);
  draw();
  requestAnimationFrame(loop);
}

addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (!running && (e.key === " " || e.key === "Enter")) { e.preventDefault(); resetGame(); }
  if (running && (e.key === " " || e.key === "Enter")) { e.preventDefault(); pump(); }
});
addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });
btn.addEventListener("click", resetGame);
addEventListener("resize", resize);

resize();
spawnRound();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
