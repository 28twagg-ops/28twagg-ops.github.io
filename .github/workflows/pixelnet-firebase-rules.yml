name: PIXEL-NET Firebase security rules emulator
on:
  push:
    branches: [work/container-fixes-2026-10-27]
    paths:
      - '.github/workflows/pixelnet-firebase-rules.yml'
      - 'PIXEL-NET/firebase/**'
      - 'PIXEL-NET/tests/firebase-rules.test.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  database-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firebase emulator and test dependencies
        run: npm install --no-save --no-package-lock firebase-tools @firebase/rules-unit-testing firebase
      - name: Test real Realtime Database rules safely
        run: npx firebase emulators:exec --project demo-pixelnet --only database --config PIXEL-NET/firebase/firebase.json 'node PIXEL-NET/tests/firebase-rules.test.cjs'
