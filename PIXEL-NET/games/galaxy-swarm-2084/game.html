<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galaxy Swarm 2084</title>
<style>
  :root{--bg:#060816;--panel:#0d1227;--accent:#00f5ff;--hot:#ff2a8a;--text:#e8f3ff}
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:transparent}
  body{font-family:ui-monospace,Consolas,monospace;color:var(--text);overflow:hidden}
  #wrap{position:relative;width:100%;height:100%}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:8px 10px;font-weight:700;text-shadow:0 0 8px #000}
  #overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(3,6,14,.84)}
  #overlay.hidden{display:none}
  .card{background:rgba(13,18,39,.95);border:1px solid rgba(0,245,255,.4);padding:18px;border-radius:10px;text-align:center;max-width:420px}
  h1{margin:0 0 10px;color:var(--accent);font-size:28px;letter-spacing:2px}
  p{margin:6px 0;color:#b9d8ff;font-size:13px}
  button{margin-top:10px;padding:10px 16px;border:1px solid var(--accent);background:#071125;color:var(--accent);cursor:pointer;font-weight:700}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="800" height="600"></canvas>
  <div id="hud"><div id="score">SCORE 0</div><div id="time">TIME 0</div></div>
  <div id="overlay">
    <div class="card">
      <h1>GALAXY SWARM 2084</h1>
      <p>Defeat incoming formations.</p>
      <p>Survive wave ramps and dodge return fire.</p>
      <button id="btn">LAUNCH</button>
    </div>
  </div>
</div>
<script>
(() => {
  const c = document.getElementById("c");
  const x = c.getContext("2d");
  const overlay = document.getElementById("overlay");
  const btn = document.getElementById("btn");
  const scoreEl = document.getElementById("score");
  const timeEl = document.getElementById("time");
  let w = 800, h = 600;
  let running = false, score = 0, ms = 0, posted = false, fireTick = 0, enemyFireTick = 0, wave = 1, lives = 3;
  let player = { x: 0, y: 0, speed: 5.4, flash: 0 };
  let keys = {};
  let bullets = [];
  let enemyBullets = [];
  let enemies = [];
  let particles = [];
  let stars = [];
  function resize() {
    const r = c.getBoundingClientRect();
    w = Math.max(480, Math.floor(r.width));
    h = Math.max(480, Math.floor(r.height));
    c.width = w; c.height = h;
    if (!stars.length) {
      for (let i = 0; i < 120; i++) stars.push({ x: Math.random() * w, y: Math.random() * h, z: 0.3 + Math.random() * 1.8 });
    } else {
      for (const s of stars) { s.x = (s.x / c.width) * w; s.y = (s.y / c.height) * h; }
    }
    player.x = w / 2;
    player.y = h - 70;
  }
  function reset() {
    score = 0; ms = 0; posted = false; fireTick = 0; enemyFireTick = 0; wave = 1; lives = 3;
    bullets = []; enemyBullets = []; enemies = []; particles = [];
    player.x = w / 2; player.y = h - 70; player.flash = 0;
    buildWave();
    running = true; overlay.classList.add("hidden");
    btn.textContent = "RESTART";
  }
  function submit() {
    if (posted) return;
    posted = true;
    try { window.parent.postMessage({ type: "GAME_OVER_SCORE", score: Number(score) || 0 }, "*"); } catch (_) {}
  }
  function endRun() {
    running = false;
    submit();
    overlay.classList.remove("hidden");
    btn.textContent = "RESTART RUN";
  }
  function spawnExplosion(px, py, col = "#ffe66a", n = 16) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.28, s = 1 + Math.random() * 4;
      particles.push({ x: px, y: py, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, col });
    }
  }
  function buildWave() {
    enemies = [];
    const rows = Math.min(5, 2 + wave);
    const cols = 8;
    const sx = Math.max(60, w / 2 - ((cols - 1) * 56) / 2);
    for (let r = 0; r < rows; r++) {
      for (let c0 = 0; c0 < cols; c0++) {
        enemies.push({
          x: sx + c0 * 56,
          y: 70 + r * 44,
          baseY: 70 + r * 44,
          vx: 0.95 + wave * 0.09,
          phase: Math.random() * 6.28,
          hp: wave >= 4 ? 2 : 1
        });
      }
    }
  }
  function chainBurst(origin, hops) {
    let from = origin;
    for (let i = 0; i < hops; i++) {
      let best = null, bestD = 1e9;
      for (const e of enemies) {
        const d = Math.hypot(e.x - from.x, e.y - from.y);
        if (d < bestD && d < 140) { best = e; bestD = d; }
      }
      if (!best) return;
      best.hp -= 1;
      spawnExplosion(best.x, best.y, "#73e3ff", 9);
      particles.push({ bolt: true, x1: from.x, y1: from.y, x2: best.x, y2: best.y, life: 0.18, col: "#73e3ff" });
      from = { x: best.x, y: best.y };
      if (best.hp <= 0) {
        score += 35;
        enemies.splice(enemies.indexOf(best), 1);
      }
    }
  }
  function hitPlayer() {
    if (player.flash > 0) return;
    lives--;
    player.flash = 1;
    spawnExplosion(player.x, player.y, "#ff6a9e", 18);
    if (lives <= 0) endRun();
  }
  function drawSpace() {
    x.fillStyle = "#060816"; x.fillRect(0, 0, w, h);
    for (const s of stars) {
      s.y += s.z * 0.4;
      if (s.y > h) { s.y = -2; s.x = Math.random() * w; }
      const a = 0.3 + s.z * 0.3;
      x.fillStyle = `rgba(138,181,255,${a})`;
      x.fillRect(s.x, s.y, s.z, s.z);
    }
    x.strokeStyle = "rgba(73,220,255,.18)";
    x.beginPath();
    x.moveTo(w * 0.1, h * 0.15); x.quadraticCurveTo(w * 0.45, h * 0.42, w * 0.9, h * 0.22);
    x.stroke();
    x.strokeStyle = "rgba(0,245,255,.35)";
    x.strokeRect(20, 20, w - 40, h - 40);
  }
  function drawEnemy(e) {
    x.save();
    x.translate(e.x, e.y);
    x.shadowBlur = 9; x.shadowColor = "#ff2a8a";
    x.fillStyle = "#ff2a8a";
    x.beginPath();
    x.moveTo(0, -12); x.lineTo(11, 0); x.lineTo(0, 12); x.lineTo(-11, 0); x.closePath();
    x.fill();
    x.fillStyle = "#60efff";
    x.beginPath();
    x.moveTo(0, -6); x.lineTo(6, 0); x.lineTo(0, 6); x.lineTo(-6, 0); x.closePath();
    x.fill();
    x.shadowBlur = 0;
    x.strokeStyle = "rgba(170,120,255,.8)";
    x.strokeRect(-14, -2, 4, 4);
    x.strokeRect(10, -2, 4, 4);
    x.restore();
  }
  function loop(ts) {
    if (!loop.prev) loop.prev = ts;
    const dt = Math.min(34, ts - loop.prev);
    loop.prev = ts;
    if (running) {
      ms += dt;
      if (player.flash > 0) player.flash -= dt / 800;
      if (ms % 1000 < dt) score += 10 + wave * 2;
      drawSpace();
      if (keys["arrowleft"] || keys["a"]) player.x -= player.speed;
      if (keys["arrowright"] || keys["d"]) player.x += player.speed;
      player.x = Math.max(40, Math.min(w - 40, player.x));
      fireTick += dt; enemyFireTick += dt;
      if ((keys[" "] || keys["enter"]) && fireTick > 170) { fireTick = 0; bullets.push({x:player.x,y:player.y-16,vy:-8}); }
      if (enemyFireTick > Math.max(460, 1100 - wave * 60) && enemies.length) {
        enemyFireTick = 0;
        const shooter = enemies[(Math.random() * enemies.length) | 0];
        enemyBullets.push({x:shooter.x,y:shooter.y+10,vy:4 + wave * 0.35});
      }
      let flip = false;
      for (const e of enemies) {
        e.x += e.vx;
        e.y = e.baseY + Math.sin(ms * 0.003 + e.phase) * 8;
        if (e.x < 36 || e.x > w - 36) flip = true;
      }
      if (flip) { for (const e of enemies) { e.vx *= -1; e.y += 14; if (e.y > h - 120) endRun(); } }
      bullets = bullets.filter(b => b.y > -20);
      enemyBullets = enemyBullets.filter(b => b.y < h + 20);
      for (const b of bullets) b.y += b.vy;
      for (const b of enemyBullets) b.y += b.vy;
      for (let i = enemies.length - 1; i >= 0; i--) {
        for (let j = bullets.length - 1; j >= 0; j--) {
          if (Math.hypot(enemies[i].x - bullets[j].x, enemies[i].y - bullets[j].y) < 18) {
            enemies[i].hp -= 1;
            bullets.splice(j, 1);
            spawnExplosion(enemies[i].x, enemies[i].y, "#ffd96d", 8);
            if (enemies[i].hp <= 0) {
              const hit = enemies[i];
              enemies.splice(i, 1);
              score += 40;
              if (Math.random() < 0.28) chainBurst({ x: hit.x, y: hit.y }, 2 + (wave > 4 ? 1 : 0));
            }
            break;
          }
        }
      }
      for (const eb of enemyBullets) if (Math.hypot(eb.x - player.x, eb.y - player.y) < 18) hitPlayer();
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        if (p.bolt) {
          p.life -= dt / 1000;
          if (p.life <= 0) particles.splice(i, 1);
          continue;
        }
        p.x += p.vx; p.y += p.vy; p.vy += 0.03; p.life -= 0.035;
        if (p.life <= 0) particles.splice(i, 1);
      }
      if (!enemies.length) { wave++; buildWave(); score += 200; }
      x.save();
      if (player.flash > 0) x.globalAlpha = 0.4 + Math.sin(ms * 0.03) * 0.35;
      x.fillStyle = "#00f5ff";
      x.beginPath(); x.moveTo(player.x,player.y-16); x.lineTo(player.x-14,player.y+14); x.lineTo(player.x+14,player.y+14); x.closePath(); x.fill();
      x.fillStyle = "#8cf6ff"; x.fillRect(player.x-2, player.y+14, 4, 14);
      x.restore();
      for (const e of enemies) drawEnemy(e);
      x.fillStyle = "#ffe66a"; for (const b of bullets) x.fillRect(b.x - 2, b.y - 8, 4, 10);
      x.fillStyle = "#ff839d"; for (const b of enemyBullets) x.fillRect(b.x - 2, b.y - 4, 4, 8);
      for (const p of particles) {
        if (p.bolt) {
          x.strokeStyle = p.col; x.lineWidth = 2; x.globalAlpha = Math.max(0, p.life * 4);
          x.beginPath();
          x.moveTo(p.x1, p.y1);
          x.lineTo((p.x1+p.x2)/2 + (Math.random()-0.5)*12, (p.y1+p.y2)/2 + (Math.random()-0.5)*10);
          x.lineTo(p.x2, p.y2);
          x.stroke();
          x.globalAlpha = 1;
          continue;
        }
        x.fillStyle = p.col; x.globalAlpha = Math.max(0, p.life); x.fillRect(p.x, p.y, 2.5, 2.5); x.globalAlpha = 1;
      }
      scoreEl.textContent = "SCORE " + score;
      timeEl.textContent = "WAVE " + wave + "  HULL " + lives;
    } else {
      drawSpace();
      scoreEl.textContent = "SCORE " + score;
      timeEl.textContent = "WAVE " + wave;
    }
    requestAnimationFrame(loop);
  }
  addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;
    if (!running && (e.key === "Enter" || e.key === " ")) reset();
  });
  addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });
  btn.addEventListener("click", reset);
  addEventListener("resize", resize);
  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
