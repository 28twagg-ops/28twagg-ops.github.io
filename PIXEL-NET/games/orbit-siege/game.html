<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tower Rush</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:ui-monospace,Consolas,monospace}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;top:0;left:0;right:0;padding:5px 12px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13px;color:#fff;text-shadow:0 0 6px #000;background:rgba(0,0,0,.55);pointer-events:none}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.84)}
#overlay.hidden{display:none}
.box{background:rgba(10,8,20,.97);border:2px solid #f8a22a;padding:22px 28px;border-radius:10px;text-align:center;max-width:420px;color:#fff}
.box h1{margin:0 0 8px;color:#f8a22a;font-size:28px;letter-spacing:3px}
.box p{margin:5px 0;color:#ffdba0;font-size:13px}
.box button{margin-top:14px;padding:11px 22px;border:2px solid #f8a22a;background:#1a0e00;color:#f8a22a;cursor:pointer;font-family:inherit;font-weight:700;font-size:14px;border-radius:4px}
.box button:hover{background:#2e1900}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="h-score">SCORE  0</div>
  <div id="h-bonus">BONUS 5000</div>
  <div id="h-stage">STAGE 1</div>
  <div id="h-lives">♥♥♥</div>
</div>
<div id="overlay">
  <div class="box">
    <h1>TOWER RUSH</h1>
    <p>Climb the girders and rescue the survivor at the top!</p>
    <p>← → / A D  Move &nbsp; ↑ W / Space  Jump</p>
    <p>↑ W  near ladder = Climb Up &nbsp; ↓ S = Climb Down</p>
    <p>Jump OVER barrels for bonus points</p>
    <p>Grab HAMMERS to smash barrels and fireballs</p>
    <button id="btn">START CLIMB</button>
  </div>
</div>
<script>
(() => {
"use strict";

/* ══ CANVAS ══ */
const cv  = document.getElementById("c");
const ctx = cv.getContext("2d");
const overlay = document.getElementById("overlay");
const btn = document.getElementById("btn");
const hScore = document.getElementById("h-score");
const hBonus = document.getElementById("h-bonus");
const hStage = document.getElementById("h-stage");
const hLives = document.getElementById("h-lives");

let W = 800, H = 600;

/* ══ GAME STATE ══ */
let running = false, posted = false;
let score = 0, lives = 3, stage = 1;
let bonusTimer = 5000, spawnTimer = 0;
let last = 0, keys = {};
let barrels = [], fireballs = [], particles = [], floats = [];
let hammerPickups = [], hammerTimer = 0, fireSpawn = 0;
let stageClearing = false;

/* ══ LAYOUT ══ */
// Recalculated on resize — these hold the computed values
let PLATS, LADDERS, KONG, GOAL, SPAWN, DRUM;

/*
  Classic DK-style platform layout:
  ─────────────────────────────────
  Level 4 (top)  [x1=PL ... x2=PR-side]  slope rightward  dir= 1  Kong LEFT, Goal RIGHT
  Level 3        [x1=PL+side ... x2=PR]  slope leftward   dir=-1
  Level 2        [x1=PL ... x2=PR-side]  slope rightward  dir= 1  Hammer here
  Level 1        [x1=PL+side ... x2=PR]  slope leftward   dir=-1
  Level 0 floor  [x1=PL ... x2=PR]       nearly flat      dir= 1  Player spawn LEFT

  Ladders alternate sides so player and barrels have a natural path.
  Barrel cascade: Kong throws → L4 rolls right → falls → L3 rolls left → falls → L2 right → … → floor
*/
function buildLayout() {
  const PL   = Math.floor(W * 0.048);
  const PR   = Math.floor(W * 0.952);
  const side = Math.floor(W * 0.065); // platform indent (alternate side)
  const lw   = Math.max(16, Math.floor(W * 0.030)); // ladder width

  // Vertical spacing — leave room for HUD top and some breathing room
  const topY  = Math.floor(H * 0.17);  // top platform y (base)
  const botY  = Math.floor(H * 0.88);  // floor y
  const gap   = Math.floor((botY - topY) / 4);

  // Platform base y values (bottom of girder visual)
  const pY = [botY, botY-gap, botY-gap*2, botY-gap*3, topY];
  // dir: 1=barrel rolls right, -1=barrel rolls left (matches slope direction)
  const slope = 0.006; // gentle — just enough for barrels to roll, not visual chaos
  PLATS = [
    { x1:PL,      x2:PR,       y:pY[0], slope: slope, dir: 1, idx:0 }, // floor
    { x1:PL+side, x2:PR,       y:pY[1], slope:-slope, dir:-1, idx:1 }, // level 1
    { x1:PL,      x2:PR-side,  y:pY[2], slope: slope, dir: 1, idx:2 }, // level 2
    { x1:PL+side, x2:PR,       y:pY[3], slope:-slope, dir:-1, idx:3 }, // level 3
    { x1:PL,      x2:PR-side,  y:pY[4], slope: slope, dir: 1, idx:4 }, // level 4 (top)
  ];

  // Helper: y on a platform at pixel x
  // ladders — alternating sides, spanning adjacent platforms
  // Barrel cascade falls: L4 right-edge → L3, L3 left-edge → L2, L2 right-edge → L1, L1 left-edge → floor
  LADDERS = [
    // main route ladders (player accessible, barrel descent route)
    { x: PR-side-lw*1.5, w:lw, yTop:pY[4]-2,  yBot:pY[3]+2,  full:true  }, // 3→4 right
    { x: PL+side+lw*0.5, w:lw, yTop:pY[3]-2,  yBot:pY[2]+2,  full:true  }, // 2→3 left
    { x: PR-side-lw*1.5, w:lw, yTop:pY[2]-2,  yBot:pY[1]+2,  full:true  }, // 1→2 right
    { x: PL+side+lw*0.5, w:lw, yTop:pY[1]-2,  yBot:pY[0]+2,  full:true  }, // 0→1 left
    // extra mid-platform ladders (partial / broken — cosmetic or one-way)
    { x: PL + Math.floor((PR-PL)*0.45), w:lw, yTop:pY[4]-2, yBot:pY[3]+Math.floor(gap*0.40), full:false, topOnly:true  },
    { x: PL + Math.floor((PR-PL)*0.55), w:lw, yTop:pY[2]-Math.floor(gap*0.40), yBot:pY[1]+2, full:false, botOnly:true  },
  ];

  const topP  = PLATS[4];
  const botP  = PLATS[0];

  KONG = {
    x: topP.x1 + lw,
    y: platY(topP, topP.x1 + lw) - 68,
    w: Math.floor(W*0.072), h: Math.floor(H*0.115)
  };
  GOAL = {
    x: topP.x2 - Math.floor(W*0.072),
    y: platY(topP, topP.x2 - Math.floor(W*0.072)) - 50,
    w: Math.floor(W*0.038), h: 48
  };
  SPAWN = { x: botP.x1 + Math.floor(W*0.06), y: platY(botP, botP.x1 + Math.floor(W*0.06)) };
  DRUM  = { x: botP.x2 - Math.floor(W*0.05), y: platY(botP, botP.x2 - Math.floor(W*0.05)) - 32, w:22, h:32 };

  // Stage hammers (classic-inspired): one on lower-mid, one on upper-mid.
  hammerPickups = [
    { x: PL + (PR-PL) * 0.30, y: platY(PLATS[1], PL + (PR-PL) * 0.30) - 18, taken:false },
    { x: PL + (PR-PL) * 0.68, y: platY(PLATS[3], PL + (PR-PL) * 0.68) - 18, taken:false }
  ];
}

function platY(p, px) {
  // y at horizontal position px; centered-slope so middle of platform = p.y
  const mid = (p.x1 + p.x2) / 2;
  return p.y + (px - mid) * p.slope;
}

function platAt(px, py, r) {
  // Return platform whose surface is at or just above (px, py-r).
  for (let i = PLATS.length-1; i >= 0; i--) {
    const p = PLATS[i];
    if (px < p.x1 - r || px > p.x2 + r) continue;
    const sy = platY(p, Math.max(p.x1, Math.min(p.x2, px)));
    if (py + r >= sy - 2 && py + r <= sy + Math.max(14, r)) return { p, sy };
  }
  return null;
}

/* ══ PLAYER ══ */
const PW = 16, PH = 26;
const P = {
  x:0, y:0, vx:0, vy:0,
  onGround:false, onLadder:false,
  dir:1, invuln:0, jumpedOver:false,
  walkT:0
};

function playerReset() {
  P.x = SPAWN.x; P.y = SPAWN.y - PH;
  P.vx=0; P.vy=0; P.onGround=false; P.onLadder=false;
  P.invuln=0; P.dir=1; P.jumpedOver=false;
}

/* ══ BARREL ══ */
function makeBarrel() {
  const top = PLATS[4];
  const blue = Math.random() < Math.min(0.38, 0.08 + stage * 0.03);
  const spd = (1.8 + stage * 0.22) * (blue ? 1.28 : 1);
  const r   = Math.max(11, Math.floor(W * 0.019));
  const sx  = KONG.x + KONG.w * 0.78;
  const sy  = platY(top, sx) - r - 2;
  return {
    x: sx, y: sy, vx: spd * top.dir, vy: 0,
    r, rot: 0, onPlat: top, blue,
    ladderChance: 0.22 + stage * 0.03,
    takingLadder: null, ladderDir: 0
  };
}

function makeFireball() {
  const bot = PLATS[0];
  const fx = DRUM.x + DRUM.w/2;
  const fy = DRUM.y - 8;
  const dir = Math.random() < 0.5 ? -1 : 1;
  return {
    x: fx, y: fy, r: Math.max(8, Math.floor(W*0.013)),
    vx: dir * (1.6 + stage * 0.14), vy: 0,
    onPlat: bot, climbCd: 700 + Math.random()*700, alive:true
  };
}

/* ══ RESET ══ */
function resetGame() {
  score=0; lives=3; stage=1; bonusTimer=5000; spawnTimer=0;
  posted=false; stageClearing=false;
  barrels=[]; fireballs=[]; particles=[]; floats=[];
  hammerTimer = 0; fireSpawn = 1800;
  buildLayout(); playerReset();
  running=true;
  overlay.classList.add("hidden");
  btn.textContent="RESTART";
}

function nextStage() {
  stage++;
  bonusTimer=5000; spawnTimer=0;
  barrels=[]; fireballs=[]; particles=[];
  stageClearing=false;
  hammerTimer = 0; fireSpawn = Math.max(850, 1800 - stage*120);
  buildLayout(); playerReset();
}

function submit() {
  if(posted)return; posted=true;
  try{window.parent.postMessage({type:"GAME_OVER_SCORE",score:Number(score)||0},"*");}catch(_){}
}
function gameOver() {
  running=false; submit();
  overlay.classList.remove("hidden");
  btn.textContent="TRY AGAIN";
}
function loseLife() {
  if(P.invuln>0) return;
  lives--;
  P.invuln=1600;
  burst(P.x, P.y+PH/2, "#ff6a2a", 18);
  if(lives<=0){ gameOver(); return; }
  playerReset();
}

/* ══ PARTICLES ══ */
function burst(px,py,col,n=12) {
  for(let i=0;i<n;i++){
    const a=Math.random()*6.28, s=1+Math.random()*5;
    particles.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.5,col,life:1,decay:0.022+Math.random()*0.018});
  }
}
function addFloat(px,py,text) {
  floats.push({x:px,y:py,text,life:1.2,vy:-1.5});
}

/* ══ UPDATE ══ */
function update(dt) {
  const MS = Math.min(dt, 34);
  if(bonusTimer>0) bonusTimer = Math.max(0, bonusTimer - MS);

  /* ── Player ── */
  P.onLadder = false;

  // Find nearest full ladder player can grab
  const nearLad = LADDERS.find(l => {
    if(!l.full) return false;
    const cx2 = l.x + l.w/2;
    return Math.abs(cx2 - P.x) < l.w + 6 && P.y + PH > l.yTop - 4 && P.y < l.yBot + 4;
  });

  const spd = 2.9 + stage * 0.07;
  P.vx = 0;
  if(keys["arrowleft"]||keys["a"]){ P.vx=-spd; P.dir=-1; }
  if(keys["arrowright"]||keys["d"]){ P.vx= spd; P.dir= 1; }

  if(hammerTimer <= 0 && nearLad && !P.onGround) {
    // On ladder — can climb
    if(keys["arrowup"]||keys["w"])  { P.vy=-2.6; P.onLadder=true; }
    if(keys["arrowdown"]||keys["s"]){ P.vy= 2.6; P.onLadder=true; }
  } else if(hammerTimer <= 0 && nearLad && P.onGround) {
    // At base of ladder — start climbing on up press
    if(keys["arrowup"]||keys["w"])  { P.vy=-2.6; P.onLadder=true; P.onGround=false; }
    if(keys["arrowdown"]||keys["s"]){ P.vy= 2.6; P.onLadder=true; P.onGround=false; }
  }

  if(!P.onLadder) {
    P.vy += 0.50 * (MS/16);
  } else {
    P.vy *= 0.65;
    P.vx = 0; // no horizontal while climbing
  }

  P.x += P.vx * (MS/16);
  P.y += P.vy * (MS/16);

  // Platform landing
  P.onGround = false;
  for(const p of PLATS) {
    if(P.x+PW/2 < p.x1 || P.x-PW/2 > p.x2) continue;
    const sy = platY(p, Math.max(p.x1,Math.min(p.x2,P.x)));
    if(P.y+PH >= sy-1 && P.y+PH <= sy+Math.max(12,P.vy+2) && P.vy>=0) {
      P.y = sy - PH; P.vy=0; P.onGround=true;
      P.jumpedOver=false;
      break;
    }
  }

  // Clamp X
  P.x = Math.max(PLATS[0].x1+PW/2, Math.min(PLATS[0].x2-PW/2, P.x));
  // Fall off bottom
  if(P.y > H+40) loseLife();
  if(P.invuln>0) P.invuln -= MS;

  // Walk animation
  if(P.onGround && Math.abs(P.vx)>0.1) P.walkT += MS*0.012;
  if(hammerTimer > 0) hammerTimer = Math.max(0, hammerTimer - MS);

  // Hammer pickup
  for (const h of hammerPickups) {
    if (h.taken) continue;
    if (Math.abs(P.x - h.x) < 16 && Math.abs((P.y + PH*0.5) - h.y) < 20) {
      h.taken = true;
      hammerTimer = 9500;
      addFloat(h.x, h.y - 10, "HAMMER!");
      burst(h.x, h.y, "#ffdd44", 20);
    }
  }

  /* ── Barrel spawn ── */
  spawnTimer -= MS;
  if(spawnTimer<=0 && !stageClearing) {
    spawnTimer = Math.max(900, 2600 - stage*180);
    barrels.push(makeBarrel());
  }

  /* ── Fireball spawn (oil drum) ── */
  fireSpawn -= MS;
  if (fireSpawn <= 0 && !stageClearing) {
    fireSpawn = Math.max(1000, 2600 - stage * 160);
    fireballs.push(makeFireball());
  }

  /* ── Barrel update ── */
  const BSPD = 1.8 + stage * 0.22;
  for(let i=barrels.length-1; i>=0; i--) {
    const b = barrels[i];

    if(b.takingLadder) {
      // Barrel sliding down a ladder
      const l = b.takingLadder;
      b.y += 2.2 * (MS/16);
      b.x = l.x + l.w/2;
      b.rot += 0.06 * (MS/16);
      if(b.y + b.r >= l.yBot) {
        // Land on the platform below this ladder
        b.y = l.yBot - b.r;
        const res = platAt(b.x, b.y + b.r, b.r);
        if(res) {
          b.onPlat = res.p;
          b.vx = BSPD * res.p.dir;
          b.vy = 0;
          b.y  = res.sy - b.r;
        }
        b.takingLadder = null;
      }
      continue;
    }

    if(b.onPlat) {
      // Rolling along platform
      const p = b.onPlat;
      b.x += b.vx * (MS/16);
      b.y  = platY(p, Math.max(p.x1,Math.min(p.x2,b.x))) - b.r;
      b.rot += (b.vx > 0 ? 1 : -1) * 0.045 * (MS/16) * Math.abs(b.vx);

      // Check for ladder descent opportunity
      if(!b.takingLadder) {
        for(const l of LADDERS) {
          if(!l.full) continue;
          const lc = l.x + l.w/2;
          if(Math.abs(b.x - lc) < l.w + 4 && b.y + b.r > l.yTop && b.y + b.r < l.yBot) {
            if(Math.random() < b.ladderChance * (MS/16)) {
              b.takingLadder = l;
              b.onPlat = null;
              b.vx=0; b.vy=0;
              break;
            }
          }
        }
        if(b.takingLadder) continue;
      }

      // Roll off left edge
      if(b.vx<0 && b.x - b.r < p.x1) {
        b.onPlat = null;
        b.vy = 0.5;
      }
      // Roll off right edge
      if(b.vx>0 && b.x + b.r > p.x2) {
        b.onPlat = null;
        b.vy = 0.5;
      }
    } else {
      // Falling
      b.vy += 0.55 * (MS/16);
      b.x  += b.vx * (MS/16) * 0.35; // slight horizontal drift while falling
      b.y  += b.vy * (MS/16);
      b.rot += 0.04 * (MS/16);

      // Land on platform?
      for(const p of PLATS) {
        if(b.x < p.x1 - b.r || b.x > p.x2 + b.r) continue;
        const sy = platY(p, Math.max(p.x1,Math.min(p.x2,b.x)));
        if(b.y + b.r >= sy - 1 && b.y + b.r <= sy + 18 && b.vy >= 0) {
          b.y = sy - b.r;
          b.vy = 0;
          b.onPlat = p;
          b.vx = BSPD * p.dir;
          break;
        }
      }
    }

    // ── Barrel vs Player ──
    if(P.invuln <= 0) {
      const dx = Math.abs(P.x - b.x);
      const dy = (P.y + PH*0.5) - b.y;
      const dist = Math.hypot(dx, dy);

      if(dist < b.r + 14) {
        if (hammerTimer > 0) {
          score += b.blue ? 500 : 300;
          addFloat(b.x, b.y-16, b.blue ? "+500 SMASH!" : "+300 SMASH!");
          burst(b.x, b.y, b.blue ? "#44aaff" : "#ff9933", 18);
          barrels.splice(i, 1);
          continue;
        }
        // Player jumping over barrel
        if(P.vy < -0.5 && P.y + PH < b.y && !P.jumpedOver) {
          P.jumpedOver = true;
          score += b.blue ? 200 : 100;
          addFloat(P.x, P.y-14, b.blue ? "+200 BLUE JUMP!" : "+100 JUMP!");
        } else if(P.y + PH*0.6 > b.y - b.r*0.8) {
          loseLife();
        }
      }
    }

    // Remove if off screen
    if(b.y > H+60 || b.x < -60 || b.x > W+60) barrels.splice(i,1);
  }

  /* ── Fireball update ── */
  for (let i = fireballs.length - 1; i >= 0; i--) {
    const f = fireballs[i];
    if (!f.alive) { fireballs.splice(i, 1); continue; }

    if (f.onPlat) {
      const p = f.onPlat;
      f.x += f.vx * (MS/16);
      f.y = platY(p, Math.max(p.x1, Math.min(p.x2, f.x))) - f.r;

      // Random direction feints
      if (Math.random() < 0.0012 * (MS/16)) f.vx *= -1;

      // Attempt ladder climb (fireballs get nastier as stage rises)
      f.climbCd -= MS;
      if (f.climbCd <= 0) {
        f.climbCd = 700 + Math.random() * 900;
        const ladder = LADDERS.find(l => l.full && Math.abs((l.x + l.w/2) - f.x) < l.w + 6 && f.y + f.r > l.yTop && f.y < l.yBot);
        if (ladder && Math.random() < Math.min(0.45, 0.15 + stage * 0.05)) {
          // Move upward to terrorize climbs, DK-style
          f.y -= 14;
          const res = platAt(ladder.x + ladder.w/2, f.y + f.r, f.r);
          if (res) {
            f.onPlat = res.p;
            f.vx = (Math.random() < 0.5 ? -1 : 1) * (1.7 + stage * 0.16);
          }
        }
      }

      // Edge fall
      if (f.vx < 0 && f.x - f.r < p.x1) { f.onPlat = null; f.vy = 0.4; }
      if (f.vx > 0 && f.x + f.r > p.x2) { f.onPlat = null; f.vy = 0.4; }
    } else {
      f.vy += 0.50 * (MS/16);
      f.y += f.vy * (MS/16);
      f.x += f.vx * 0.25 * (MS/16);

      // Land?
      for (const p of PLATS) {
        if (f.x < p.x1 - f.r || f.x > p.x2 + f.r) continue;
        const sy = platY(p, Math.max(p.x1, Math.min(p.x2, f.x)));
        if (f.y + f.r >= sy - 1 && f.y + f.r <= sy + 16 && f.vy >= 0) {
          f.y = sy - f.r;
          f.vy = 0;
          f.onPlat = p;
          f.vx = (Math.random() < 0.5 ? -1 : 1) * (1.7 + stage * 0.16);
          break;
        }
      }
    }

    // Fireball vs player
    const d = Math.hypot(P.x - f.x, (P.y + PH*0.55) - f.y);
    if (d < f.r + 12) {
      if (hammerTimer > 0) {
        score += 400;
        addFloat(f.x, f.y-12, "+400 FIRE SMASH!");
        burst(f.x, f.y, "#ff6600", 18);
        fireballs.splice(i, 1);
        continue;
      }
      loseLife();
    }

    if (f.y > H + 80 || f.x < -80 || f.x > W + 80) fireballs.splice(i, 1);
  }

  /* ── Goal reached ── */
  if(!stageClearing) {
    const gx = GOAL.x + GOAL.w/2, gy = GOAL.y + GOAL.h/2;
    if(Math.abs(P.x - gx) < GOAL.w && Math.abs((P.y+PH/2) - gy) < GOAL.h) {
      stageClearing = true;
      const bonus = Math.floor(bonusTimer * 0.08);
      score += 1000 + bonus;
      burst(gx, gy, "#ffe066", 36);
      addFloat(gx, gy-24, "RESCUED! +"+(1000+bonus));
      setTimeout(nextStage, 1200);
    }
  }

  /* ── Particles / Floats ── */
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx*(MS/16); p.y+=p.vy*(MS/16); p.vy+=0.06*(MS/16);
    p.life-=p.decay*(MS/16);
    if(p.life<=0) particles.splice(i,1);
  }
  for(let i=floats.length-1;i>=0;i--){
    floats[i].y+=floats[i].vy*(MS/16);
    floats[i].life-=0.018*(MS/16);
    if(floats[i].life<=0) floats.splice(i,1);
  }

  /* ── HUD ── */
  hScore.textContent = "SCORE " + score;
  hBonus.textContent = "BONUS " + Math.floor(bonusTimer) + (hammerTimer>0 ? "  HAMMER " + (hammerTimer/1000).toFixed(1) : "");
  hStage.textContent = "STAGE " + stage;
  hLives.textContent = "♥".repeat(Math.max(0,lives)) + "♡".repeat(Math.max(0,3-lives));
}

/* ══ DRAW FUNCTIONS ══ */
function drawBG() {
  // Night sky gradient
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#080510"); g.addColorStop(1,"#1a0e06");
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // City skyline silhouette
  ctx.fillStyle="rgba(30,15,5,.7)";
  const bw=Math.floor(W/14);
  for(let i=0;i<14;i++){
    const bh=Math.floor(H*0.14)+Math.floor(Math.sin(i*2.4)*H*0.07);
    ctx.fillRect(i*bw, H-bh, bw-2, bh);
  }
  // Window lights
  ctx.fillStyle="rgba(255,220,80,.28)";
  for(let i=0;i<14;i++){
    const bh=Math.floor(H*0.14)+Math.floor(Math.sin(i*2.4)*H*0.07);
    for(let wy=H-bh+6; wy<H-8; wy+=8){
      for(let wx=i*bw+3; wx<(i+1)*bw-5; wx+=6){
        if(Math.sin(wx*7.3+wy*3.1)>0.5) ctx.fillRect(wx,wy,3,4);
      }
    }
  }

  // Moon
  ctx.shadowBlur=20; ctx.shadowColor="#ffd070";
  ctx.fillStyle="#ffd888";
  ctx.beginPath(); ctx.arc(W*0.84, H*0.12, Math.floor(H*0.05), 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;

  // Scaffolding verticals
  ctx.strokeStyle="rgba(90,55,20,.22)"; ctx.lineWidth=2;
  for(let x=Math.floor(W*0.12);x<W;x+=Math.floor(W*0.095)){
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
  }
}

function drawGirder(p) {
  const x1=p.x1, y1=platY(p,p.x1), x2=p.x2, y2=platY(p,p.x2);
  const thick=Math.max(9,Math.floor(H*0.017));

  // Drop shadow
  ctx.strokeStyle="rgba(0,0,0,.55)"; ctx.lineWidth=thick+4;
  ctx.beginPath(); ctx.moveTo(x1+2,y1+5); ctx.lineTo(x2+2,y2+5); ctx.stroke();

  // I-beam bottom flange
  ctx.strokeStyle="#6a3808"; ctx.lineWidth=thick+6;
  ctx.beginPath(); ctx.moveTo(x1,y1+4); ctx.lineTo(x2,y2+4); ctx.stroke();

  // Web (main body)
  const grd=ctx.createLinearGradient(0,y1-thick,0,y1+thick);
  grd.addColorStop(0,"#e8901c"); grd.addColorStop(0.35,"#f8a22a"); grd.addColorStop(1,"#7a3f08");
  ctx.strokeStyle=grd; ctx.lineWidth=thick;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();

  // Top flange highlight
  ctx.strokeStyle="rgba(255,200,100,.5)"; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(x1,y1-Math.floor(thick/2)); ctx.lineTo(x2,y2-Math.floor(thick/2)); ctx.stroke();

  // Rivets
  const rv = Math.floor((p.x2-p.x1) / Math.floor(W*0.075));
  ctx.fillStyle="#5a2a05";
  for(let i=1;i<=rv;i++){
    const rx=p.x1+(p.x2-p.x1)/(rv+1)*i;
    const ry=platY(p,rx);
    ctx.beginPath(); ctx.arc(rx,ry,3.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#d4720e";
    ctx.beginPath(); ctx.arc(rx-1,ry-1,1.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#5a2a05";
  }
}

function drawLadder(l) {
  const broken = !l.full;
  const rungGap=9;
  const railCol = broken ? "#7a7a60" : "#dce8a0";
  const rungCol = broken ? "#666650" : "#c8d880";

  // Top cap for broken-top ladders
  const drawTop = !l.topOnly || !broken;
  const drawBot = !l.botOnly || !broken;

  ctx.strokeStyle=railCol; ctx.lineWidth=3;
  ctx.setLineDash(broken ? [6,4] : []);
  ctx.beginPath(); ctx.moveTo(l.x, l.yTop); ctx.lineTo(l.x, l.yBot); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(l.x+l.w, l.yTop); ctx.lineTo(l.x+l.w, l.yBot); ctx.stroke();
  ctx.setLineDash([]);

  ctx.strokeStyle=rungCol; ctx.lineWidth=2;
  for(let ry=l.yTop+4;ry<l.yBot;ry+=rungGap){
    ctx.beginPath(); ctx.moveTo(l.x,ry); ctx.lineTo(l.x+l.w,ry); ctx.stroke();
  }
}

function drawDrum() {
  const {x,y,w,h}=DRUM;
  ctx.fillStyle="#1c1c1c"; ctx.fillRect(x,y,w,h);
  ctx.strokeStyle="#555"; ctx.lineWidth=1.5; ctx.strokeRect(x,y,w,h);
  for(let i=1;i<3;i++){
    ctx.beginPath(); ctx.moveTo(x,y+h*(i/3)); ctx.lineTo(x+w,y+h*(i/3)); ctx.stroke();
  }
  const ft=Date.now()*0.005;
  for(let fi=0;fi<2;fi++){
    const off=fi*3;
    const fc=fi===0?"#ff6a00":"#ffd000";
    ctx.shadowBlur=14; ctx.shadowColor=fc;
    ctx.fillStyle=fc;
    ctx.beginPath();
    ctx.moveTo(x+w/2+off, y-16+off);
    ctx.bezierCurveTo(x+w+3, y-6+Math.sin(ft+fi)*5, x+w, y, x+w/2+4, y+2);
    ctx.bezierCurveTo(x+w/2, y-5, x, y, x-3, y-6+Math.sin(ft+fi+1)*5);
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur=0;
  }
}

function drawKong(throwing) {
  const {x,y,w,h}=KONG;
  const t=Date.now()*0.003;
  const throwAnim = throwing ? Math.max(0,Math.sin(t*3)) : 0;

  // Body
  ctx.fillStyle="#231408";
  ctx.beginPath(); ctx.ellipse(x+w/2,y+h*0.62,w*0.4,h*0.33,0,0,Math.PI*2); ctx.fill();

  // Chest fur patch
  ctx.fillStyle="#4e2c0a";
  ctx.beginPath(); ctx.ellipse(x+w/2,y+h*0.58,w*0.22,h*0.2,0,0,Math.PI*2); ctx.fill();

  // Head
  ctx.fillStyle="#231408";
  ctx.beginPath(); ctx.ellipse(x+w/2,y+h*0.3,w*0.3,h*0.27,0,0,Math.PI*2); ctx.fill();

  // Brow
  ctx.fillStyle="#160c04";
  ctx.beginPath(); ctx.ellipse(x+w/2,y+h*0.19,w*0.26,h*0.09,0,0,Math.PI*2); ctx.fill();

  // Eyes glow
  ctx.shadowBlur=10; ctx.shadowColor="#cc2200";
  ctx.fillStyle="#ee3300";
  ctx.beginPath(); ctx.arc(x+w/2-7,y+h*0.25,4,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+w/2+7,y+h*0.25,4,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;

  // Nostrils
  ctx.fillStyle="#0d0804";
  ctx.beginPath(); ctx.arc(x+w/2-4,y+h*0.34,2.2,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+w/2+4,y+h*0.34,2.2,0,Math.PI*2); ctx.fill();

  // Teeth (angry grimace)
  ctx.fillStyle="#fff";
  ctx.fillRect(x+w/2-6,y+h*0.38,4,5);
  ctx.fillRect(x+w/2+2,y+h*0.38,4,5);

  ctx.strokeStyle="#231408"; ctx.lineWidth=9; ctx.lineCap="round";

  // Left arm (idle beat down, or raise on throw)
  const lArmSwing = Math.sin(t*1.4)*6;
  ctx.beginPath();
  ctx.moveTo(x+w*0.18, y+h*0.5);
  ctx.quadraticCurveTo(x-6, y+h*0.72+lArmSwing, x+w*0.04, y+h*0.88);
  ctx.stroke();

  // Right arm — throwing arm raises toward right
  const rArmUp = throwAnim * 28;
  ctx.beginPath();
  ctx.moveTo(x+w*0.82, y+h*0.5);
  ctx.quadraticCurveTo(x+w+10, y+h*0.38-rArmUp, x+w+6, y+h*0.22-rArmUp);
  ctx.stroke();
  ctx.lineCap="butt";

  // Legs
  ctx.strokeStyle="#231408"; ctx.lineWidth=8; ctx.lineCap="round";
  ctx.beginPath();
  ctx.moveTo(x+w*0.35,y+h*0.9); ctx.lineTo(x+w*0.28,y+h);
  ctx.moveTo(x+w*0.65,y+h*0.9); ctx.lineTo(x+w*0.72,y+h);
  ctx.stroke(); ctx.lineCap="butt";

  // Chest-beat visual (fists on chest)
  if(!throwing && Math.sin(t*2.5)>0.6) {
    ctx.fillStyle="#3a1a06";
    ctx.beginPath(); ctx.arc(x+w*0.24,y+h*0.58,7,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x+w*0.76,y+h*0.58,7,0,Math.PI*2); ctx.fill();
  }
}

function drawGoal() {
  const {x,y,w,h}=GOAL;
  const t=Date.now()*0.005;
  ctx.shadowBlur=20; ctx.shadowColor="#ffe066";

  // Heart beacon
  ctx.fillStyle="#ffe066";
  ctx.font="bold "+Math.floor(h*0.3)+"px monospace";
  ctx.textAlign="center";
  ctx.fillText("♥",x+w/2, y+2+Math.sin(t)*4);

  // Figure
  const fx=x+w/2, fy=y+h*0.22;
  ctx.fillStyle="#f5c08a";
  ctx.beginPath(); ctx.arc(fx,fy,h*0.14,0,Math.PI*2); ctx.fill(); // head

  ctx.fillStyle="#ff4488";
  ctx.fillRect(fx-7,fy+h*0.16,14,h*0.33); // torso

  // Waving arms
  ctx.save(); ctx.translate(fx-7,fy+h*0.22);
  ctx.rotate(Math.sin(t)*0.5); ctx.fillStyle="#f5c08a";
  ctx.fillRect(-10,0,10,4); ctx.restore();
  ctx.save(); ctx.translate(fx+7,fy+h*0.22);
  ctx.rotate(-Math.sin(t)*0.5); ctx.fillStyle="#f5c08a";
  ctx.fillRect(0,0,10,4); ctx.restore();

  ctx.fillStyle="#3344bb";
  ctx.fillRect(fx-6,fy+h*0.5,5,h*0.35);
  ctx.fillRect(fx+1,fy+h*0.5,5,h*0.35);

  ctx.shadowBlur=0;
}

function drawBarrel(b) {
  ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.rot);
  const body = b.blue ? "#2c5ab8" : "#8c3a0a";
  const ring = b.blue ? "#6aa8ff" : "#c86018";
  const band = b.blue ? "#1b2f66" : "#5a2406";
  ctx.shadowBlur=7; ctx.shadowColor=b.blue ? "#4fa2ff" : "#d96010";

  // Body
  ctx.fillStyle=body;
  ctx.beginPath(); ctx.arc(0,0,b.r,0,Math.PI*2); ctx.fill();

  // Outer ring
  ctx.strokeStyle=ring; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.arc(0,0,b.r,0,Math.PI*2); ctx.stroke();

  // Barrel staves (wood planks)
  ctx.strokeStyle=band; ctx.lineWidth=1.5;
  for(let a=0;a<Math.PI;a+=Math.PI/5){
    const nx=Math.cos(a)*b.r, ny=Math.sin(a)*b.r;
    ctx.beginPath(); ctx.moveTo(-nx,-ny); ctx.lineTo(nx,ny); ctx.stroke();
  }

  // Metal bands
  ctx.strokeStyle=b.blue ? "#9ec3ff" : "#d06010"; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(0,0,b.r*0.72,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(0,0,b.r*0.42,0,Math.PI*2); ctx.stroke();

  // Highlight
  ctx.fillStyle="rgba(255,160,60,.22)";
  ctx.beginPath(); ctx.arc(-b.r*0.28,-b.r*0.28,b.r*0.36,0,Math.PI*2); ctx.fill();

  ctx.shadowBlur=0;
  ctx.restore();
}

function drawFireball(f) {
  const t = Date.now() * 0.008;
  ctx.save();
  ctx.translate(f.x, f.y);
  ctx.shadowBlur = 12; ctx.shadowColor = "#ff5500";
  ctx.fillStyle = "#ff6600";
  ctx.beginPath();
  ctx.arc(0, 0, f.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#ffd000";
  ctx.beginPath();
  ctx.arc(Math.sin(t) * 1.5, -1, f.r * 0.55, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#1a0800";
  ctx.beginPath(); ctx.arc(-f.r*0.25, -f.r*0.12, 1.8, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc( f.r*0.25, -f.r*0.12, 1.8, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.restore();
}

function drawHammer(h) {
  if (h.taken) return;
  const t = Date.now() * 0.006;
  ctx.save();
  ctx.translate(h.x, h.y + Math.sin(t) * 2);
  ctx.rotate(-0.45);
  ctx.shadowBlur = 10; ctx.shadowColor = "#ffe066";
  // Handle
  ctx.fillStyle = "#7a4a1a";
  ctx.fillRect(-2, -14, 4, 18);
  // Head
  ctx.fillStyle = "#ffd54a";
  ctx.fillRect(-8, -18, 16, 7);
  // End cap
  ctx.fillStyle = "#fff0a0";
  ctx.fillRect(4, -18, 3, 7);
  ctx.shadowBlur = 0;
  ctx.restore();
}

function drawPlayer() {
  const {x,y,dir,invuln,onLadder,walkT}=P;
  if(invuln>0 && Math.floor(invuln/120)%2===0) return;

  ctx.save(); ctx.translate(x,y+PH);
  if(dir<0) ctx.scale(-1,1);

  const leg = P.onGround ? Math.sin(walkT)*6 : 0;
  const arm = onLadder ? Math.sin(walkT*1.5)*8 : leg*0.4;

  // Shadow
  ctx.fillStyle="rgba(0,0,0,.25)";
  ctx.beginPath(); ctx.ellipse(0,2,PW/2+2,4,0,0,Math.PI*2); ctx.fill();

  // Left leg
  ctx.fillStyle="#2244bb";
  ctx.fillRect(-PW/2+2,-PH*0.44, PW/2-1, PH*0.44);
  // Right leg
  ctx.fillRect(1,-PH*0.44+leg, PW/2-1, PH*0.44);

  // Boots
  ctx.fillStyle="#442200";
  ctx.fillRect(-PW/2+1,-PH*0.1,PW/2,PH*0.1+2);
  ctx.fillRect(1,-PH*0.1+leg,PW/2,PH*0.1+2);

  // Body
  ctx.fillStyle="#cc2211";
  ctx.fillRect(-PW/2+1,-PH*0.72,PW-2,PH*0.32);

  // Overalls bib
  ctx.fillStyle="#2244bb";
  ctx.fillRect(-5,-PH*0.72,10,PH*0.16);

  // Left arm
  ctx.fillStyle="#cc2211";
  ctx.fillRect(-PW/2-6,-PH*0.72+arm,7,PH*0.24);
  // Right arm
  ctx.fillRect(PW/2-1,-PH*0.72-arm,7,PH*0.24);

  // Gloves
  ctx.fillStyle="#eeeeee";
  ctx.fillRect(-PW/2-8,-PH*0.5+arm,9,8);
  ctx.fillRect(PW/2-1,-PH*0.5-arm,9,8);

  // Head
  ctx.fillStyle="#f0ae70";
  ctx.fillRect(-PW/2+3,-PH,PW-6,PH*0.28);

  // Cap
  ctx.fillStyle="#cc2211";
  ctx.fillRect(-PW/2+2,-PH,PW-4,PH*0.12);
  ctx.fillRect(-PW/2-2,-PH+PH*0.1,PW+4,PH*0.09);
  // Cap brim
  ctx.fillStyle="#aa1a00";
  ctx.fillRect(PW/2-2,-PH+PH*0.1,7,PH*0.06);

  // Eye
  ctx.fillStyle="#111";
  ctx.fillRect(PW/2-9,-PH+PH*0.14,4,4);
  // Mustache
  ctx.fillStyle="#5a2e00";
  ctx.fillRect(PW/2-12,-PH+PH*0.26,12,4);

  // Hammer state: glow + raised hammer sprite
  if (hammerTimer > 0) {
    const ht = Date.now() * 0.01;
    ctx.shadowBlur = 16; ctx.shadowColor = "#ffe066";
    ctx.strokeStyle = "rgba(255,226,96,0.7)";
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.arc(0, -PH*0.45, PW*0.9 + Math.sin(ht)*1.5, 0, Math.PI*2);
    ctx.stroke();
    // hand-held hammer
    ctx.save();
    ctx.translate(PW*0.46, -PH*0.66);
    ctx.rotate(-0.55 + Math.sin(ht)*0.08);
    ctx.fillStyle="#7a4a1a"; ctx.fillRect(-2,-11,4,14);
    ctx.fillStyle="#ffd54a"; ctx.fillRect(-8,-14,16,6);
    ctx.fillStyle="#fff0a0"; ctx.fillRect(4,-14,3,6);
    ctx.restore();
    ctx.shadowBlur = 0;
  }

  ctx.restore();
}

/* ══ RENDER ══ */
function render() {
  drawBG();

  // Draw platforms bottom to top for proper layering
  for(const p of PLATS) drawGirder(p);
  for(const l of LADDERS) drawLadder(l);
  drawDrum();
  for (const h of hammerPickups) drawHammer(h);

  const throwingNow = barrels.length > 0 && barrels[barrels.length-1].y < PLATS[4].y - 10;
  drawKong(throwingNow || spawnTimer < 400);
  drawGoal();

  // Barrels
  for(const b of barrels) drawBarrel(b);
  for (const f of fireballs) drawFireball(f);

  drawPlayer();

  // Particles
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.col;
    ctx.shadowBlur=3; ctx.shadowColor=p.col;
    ctx.beginPath(); ctx.arc(p.x,p.y,2.5,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
  }
  ctx.globalAlpha=1;

  // Floats
  ctx.font="bold 14px ui-monospace,monospace";
  ctx.textAlign="center";
  for(const f of floats){
    ctx.globalAlpha=Math.max(0,f.life*0.9);
    ctx.fillStyle="#ffe066";
    ctx.shadowBlur=7; ctx.shadowColor="#ffe066";
    ctx.fillText(f.text,f.x,f.y);
    ctx.shadowBlur=0;
  }
  ctx.globalAlpha=1;

  // Bonus bar
  if(running){
    const bw=Math.floor(W*0.24), bh=6;
    const bx=Math.floor((W-bw)/2), by=H-10;
    const frac=Math.max(0,bonusTimer/5000);
    ctx.fillStyle="rgba(0,0,0,.5)"; ctx.fillRect(bx,by,bw,bh);
    ctx.fillStyle=frac>0.5?"#22ff88":frac>0.25?"#ffcc00":"#ff3322";
    ctx.fillRect(bx,by,Math.floor(bw*frac),bh);
    ctx.strokeStyle="rgba(255,255,255,.2)"; ctx.lineWidth=1;
    ctx.strokeRect(bx,by,bw,bh);
    ctx.fillStyle="rgba(255,255,255,.35)";
    ctx.font="9px ui-monospace,monospace"; ctx.textAlign="center";
    ctx.fillText("BONUS TIMER",bx+bw/2,by-2);
  }
}

/* ══ MAIN LOOP ══ */
function loop(ts){
  if(!last)last=ts;
  const dt=ts-last; last=ts;
  if(running) update(dt);
  render();
  requestAnimationFrame(loop);
}

/* ══ INPUT ══ */
addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  keys[k]=true;
  if(!running&&(e.key==="Enter"||e.key===" ")){e.preventDefault();resetGame();}
  if(running&&(e.key===" "||e.key==="ArrowUp"||k==="w")&&P.onGround&&hammerTimer<=0){
    P.vy=-(9.0+stage*0.12);
    P.onGround=false;
    P.jumpedOver=false;
    e.preventDefault();
  }
  if(e.key==="ArrowUp"||e.key===" ") e.preventDefault();
});
addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false;});
btn.addEventListener("click",resetGame);
addEventListener("resize",()=>{
  const r=cv.getBoundingClientRect();
  W=Math.max(480,Math.floor(r.width));
  H=Math.max(360,Math.floor(r.height));
  cv.width=W; cv.height=H;
  if(running) buildLayout();
});

(function initSize(){
  const r=cv.getBoundingClientRect();
  W=Math.max(480,Math.floor(r.width));
  H=Math.max(360,Math.floor(r.height));
  cv.width=W; cv.height=H;
  buildLayout();
})();

requestAnimationFrame(loop);
})();
</script>
