name: PIXEL-NET leaderboard game-by-game verification
on:
  push:
    branches: [work/container-fixes-2026-10-27]
    paths:
      - 'PIXEL-NET/tests/leaderboard-all-games.cjs'
      - 'PIXEL-NET/wrapper/shell.js'
      - 'PIXEL-NET/games/**'
      - '.github/workflows/pixelnet-leaderboard-fast.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 --directory PIXEL-NET >/tmp/pixelnet-leaderboard.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/games.json >/dev/null && break || sleep 1; done
      - name: Exercise all playable game score submissions (mock Firebase, no production writes)
        run: PIXELNET_GAME=neon-chase node PIXEL-NET/tests/leaderboard-all-games.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leaderboard-game-by-game-report
          path: leaderboard-all-games-results/report.json
