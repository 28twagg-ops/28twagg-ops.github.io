name: Public licensed game release test
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  licensed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve site locally
        run: |
          python3 -m http.server 8765 --directory PIXEL-NET > /tmp/licensed-games.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/licensed/catalog.json >/dev/null && break || sleep 1; done
      - name: Launch all 10 games, verify license notices, and block score uploads
        run: node PIXEL-NET/tests/licensed-games-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-licensed-games-audit
          path: licensed-smoke-results/
