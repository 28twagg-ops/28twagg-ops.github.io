name: Millipede visual pilot validation
on:
  push:
    branches:
      - pilot/millipede-visual-2026-10-27
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 --directory PIXEL-NET >/tmp/millipede-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/games/millipede-chaos-v3/game.html >/dev/null && break || sleep 1; done
      - name: Run browser smoke test
        run: node PIXEL-NET/tests/millipede-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: millipede-visual-browser-proof
          path: |
            millipede-test-results/
            PIXEL-NET/games/millipede-chaos-v3/game.html
          if-no-files-found: warn
