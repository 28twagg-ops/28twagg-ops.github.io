<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tower Rush</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:transparent}
body{font-family:ui-monospace,Consolas,monospace;overflow:hidden;color:#e9edff}
canvas{position:absolute;inset:0;width:100%;height:100%}
#hud{position:absolute;top:0;left:0;right:0;padding:8px 10px;display:flex;justify-content:space-between;font-weight:700;text-shadow:0 0 8px #000}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,8,18,.86)}
#overlay.hidden{display:none}
.box{background:rgba(14,14,31,.95);border:1px solid #9f7bff;padding:18px;border-radius:12px;text-align:center}
h1{margin:0 0 8px;font-size:26px;color:#9f7bff}
p{margin:6px 0;color:#cfbeff;font-size:13px}
button{margin-top:10px;padding:10px 16px;background:#130f2f;border:1px solid #9f7bff;color:#d7c6ff;cursor:pointer}
</style>
</head>
<body>
<canvas id="c" width="800" height="600"></canvas>
<div id="hud"><div id="score">SCORE 0</div><div id="wave">STAGE 1</div><div id="hp">LIVES 3</div></div>
<div id="overlay"><div class="box"><h1>TOWER RUSH</h1><p>Climb to the top while dodging rolling hazards.</p><p>Reach the relay node to clear each stage.</p><button id="btn">START CLIMB</button></div></div>
<script>
(() => {
  const c=document.getElementById("c"),x=c.getContext("2d"),overlay=document.getElementById("overlay"),btn=document.getElementById("btn");
  const scoreEl=document.getElementById("score"),waveEl=document.getElementById("wave"),hpEl=document.getElementById("hp");
  let w=800,h=600,score=0,lives=3,stage=1,posted=false,running=false,last=0,spawn=0;
  let keys={},player={x:60,y:540,vx:0,vy:0,onGround:false},barrels=[],platforms=[];
  function resize(){const b=c.getBoundingClientRect();w=Math.max(520,Math.floor(b.width));h=Math.max(420,Math.floor(b.height));c.width=w;c.height=h;player.y=h-56;}
  function buildStage(){
    platforms = [
      {x:40, y:h-60, w:w-80, h:12},
      {x:80, y:h-150, w:w-180, h:12},
      {x:120,y:h-240, w:w-120, h:12},
      {x:60, y:h-330, w:w-190, h:12},
      {x:120,y:h-420, w:w-120, h:12}
    ];
    barrels = [];
    player.x = 70; player.y = h-84; player.vx=0; player.vy=0;
    spawn = 0;
  }
  function reset(){score=0;lives=3;stage=1;posted=false;running=true;buildStage();overlay.classList.add("hidden");}
  function submit(){if(posted)return;posted=true;try{window.parent.postMessage({type:"GAME_OVER_SCORE",score:Number(score)||0},"*");}catch(_){ }}
  function end(){running=false;submit();overlay.classList.remove("hidden");btn.textContent="RESTART CLIMB";}
  function loseLife(){ lives--; if(lives<=0) end(); else { player.x=70; player.y=h-84; player.vx=0; player.vy=0; barrels=[]; } }
  addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()] = true;
    if((e.key===" "||e.key==="Enter")&&!running) reset();
    if((e.key===" "||e.key==="arrowup"||e.key.toLowerCase()==="w")&&running&&player.onGround){ player.vy=-9.2; player.onGround=false; }
  });
  addEventListener("keyup",e=>{ keys[e.key.toLowerCase()] = false; });
  btn.addEventListener("click",reset);
  function loop(ts){
    if(!last)last=ts; const dt=Math.min(34,ts-last); last=ts;
    x.fillStyle="#0a0a14";x.fillRect(0,0,w,h);
    x.fillStyle="#1d2245"; x.fillRect(0,0,w,40);
    if(running){
      player.vx = 0;
      if(keys["arrowleft"]||keys["a"]) player.vx = -4.2;
      if(keys["arrowright"]||keys["d"]) player.vx = 4.2;
      player.x += player.vx;
      player.vy += 0.48;
      player.y += player.vy;
      player.onGround = false;
      for(const p of platforms){
        if(player.x+12 > p.x && player.x-12 < p.x+p.w && player.y+14 >= p.y && player.y+14 <= p.y+p.h+Math.max(1,player.vy)){
          player.y = p.y-14; player.vy = 0; player.onGround = true;
        }
      }
      if(player.y > h+20) loseLife();
      player.x = Math.max(12, Math.min(w-12, player.x));

      spawn += dt;
      if(spawn > Math.max(620, 1600 - stage*120)){
        spawn = 0;
        barrels.push({x:w-60, y:h-446, vx:-(2.2+stage*0.15), vy:0, r:10});
      }
      for(const b of barrels){
        b.x += b.vx;
        const currentPlat = platforms.find(p => b.y + b.r >= p.y-2 && b.y + b.r <= p.y+6 && b.x > p.x && b.x < p.x + p.w);
        if(currentPlat){
          if((b.vx < 0 && b.x < currentPlat.x + 8) || (b.vx > 0 && b.x > currentPlat.x + currentPlat.w - 8)){
            b.vx *= -1; b.y += 90;
          }
        }
        if(Math.hypot(b.x-player.x,b.y-player.y)<22) loseLife();
      }
      barrels = barrels.filter(b => b.y < h+40);

      if(player.y < h-442 && player.x > w-120){ score += 500; stage++; buildStage(); }
      score += Math.max(0, Math.floor((h - player.y) * 0.001));
    }
    for(const p of platforms){ x.fillStyle="#3a2a64"; x.fillRect(p.x,p.y,p.w,p.h); }
    x.fillStyle="#72ffcc"; x.fillRect(w-112,h-448,18,18);
    for(const b of barrels){ x.fillStyle="#ff5ea8"; x.beginPath(); x.arc(b.x,b.y,b.r,0,6.28); x.fill(); }
    x.fillStyle="#9f7bff"; x.fillRect(player.x-10,player.y-14,20,28);
    scoreEl.textContent="SCORE "+score; waveEl.textContent="STAGE "+stage; hpEl.textContent="LIVES "+lives;
    requestAnimationFrame(loop);
  }
  addEventListener("resize",resize); resize(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
