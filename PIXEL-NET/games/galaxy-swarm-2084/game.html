<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galaxy Swarm 2084</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#wrap{position:relative;width:100%;height:100%}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:6px 12px;font-family:ui-monospace,Consolas,monospace;font-weight:700;font-size:13px;pointer-events:none;background:rgba(0,0,0,.5);color:#e8f3ff;text-shadow:0 0 8px #00f5ff}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(3,6,20,.88)}
#overlay.hidden{display:none}
.card{background:rgba(6,12,36,.97);border:2px solid rgba(0,245,255,.5);padding:22px 28px;border-radius:10px;text-align:center;max-width:420px;font-family:ui-monospace,Consolas,monospace}
.card h1{margin:0 0 10px;color:#00f5ff;font-size:28px;letter-spacing:3px}
.card p{margin:5px 0;color:#a0d0ff;font-size:13px}
.card button{margin-top:14px;padding:11px 22px;border:2px solid #00f5ff;background:#020d22;color:#00f5ff;cursor:pointer;font-family:inherit;font-weight:700;font-size:14px;border-radius:4px}
.card button:hover{background:#061c3e}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c"></canvas>
<div id="hud">
  <div id="h-score">SCORE 0</div>
  <div id="h-wave">WAVE 1</div>
  <div id="h-info">HULL ♥♥♥  ×1</div>
</div>
<div id="overlay">
  <div class="card">
    <h1>GALAXY SWARM 2084</h1>
    <p>Three enemy classes. Diving assaults. Boss waves.</p>
    <p>Move: ← → / A D &nbsp; Fire: Space / Enter</p>
    <p>Shoot enemies mid-dive for a DIVE BONUS</p>
    <p>Build your kill combo for score multiplier</p>
    <button id="btn">LAUNCH</button>
  </div>
</div>
</div>
<script>
(() => {
"use strict";

/* ── canvas / context ── */
const wrap = document.getElementById("wrap");
const cv   = document.getElementById("c");
const cx   = cv.getContext("2d");
const overlay = document.getElementById("overlay");
const btn     = document.getElementById("btn");
const hScore  = document.getElementById("h-score");
const hWave   = document.getElementById("h-wave");
const hInfo   = document.getElementById("h-info");

let W = 800, H = 600;

/* ── game state ── */
let running = false, posted = false;
let score = 0, wave = 1, lives = 3, combo = 0, comboTimer = 0;
let fireCooldown = 0, shakeT = 0, shakeAmt = 0;
let dualShot = false, dualTimer = 0;
let shielded = false, shieldTimer = 0;
let waveIntro = 0;
let last = 0;
let keys = {};

/* ── Formation state (shared by all non-diving enemies) ── */
let formDx     = 0;    // current x-offset from base positions
let formDir    = 1;    // +1 right / -1 left
let formSpd    = 0.5;  // pixels per frame — starts slow, scales with wave + enemy count
let formStepY  = 16;   // how far down formation steps on wall hit
let maxEBullets = 2;   // max enemy bullets on screen at once (scales with wave)

/* ── entity pools ── */
let stars = [], nebula = [];
let bullets = [], eBullets = [];
let enemies = [];
let particles = [];
let bunkers = [];
let floats = []; // floating score text

/* ── player ── */
const P = { x: 400, y: 530, speed: 5.5, flash: 0, w: 28, h: 20 };

/* ── enemy types ── */
const ETYPE = {
  DRONE:  { col: "#ff2a8a", col2: "#ff80c0", pts: 50,  hp: 1, r: 13 },
  GUNSHIP:{ col: "#ff8c00", col2: "#ffe080", pts: 120, hp: 2, r: 15 },
  ELITE:  { col: "#8844ff", col2: "#cc99ff", pts: 200, hp: 3, r: 14 },
  BOSS:   { col: "#00ff88", col2: "#00ffee", pts: 1000, hp: 20, r: 30 }
};

/* ══════════════════════════════════════════════════
   RESIZE
══════════════════════════════════════════════════ */
function resize() {
  const r = cv.getBoundingClientRect();
  W = Math.max(480, Math.floor(r.width));
  H = Math.max(400, Math.floor(r.height));
  cv.width = W; cv.height = H;
  P.y = H - 64;
  P.x = Math.min(P.x, W - 40);
  if (!stars.length) initStars();
}

function initStars() {
  stars = [];
  for (let i = 0; i < 160; i++)
    stars.push({ x: Math.random()*W, y: Math.random()*H, z: 0.3 + Math.random()*2.2, twinkle: Math.random()*6.28 });
  nebula = [];
  for (let i = 0; i < 6; i++)
    nebula.push({ x: Math.random()*W, y: Math.random()*H*0.7, r: 60+Math.random()*140, col: Math.random()<0.5?"#1a0a3a":"#001a20" });
}

/* ══════════════════════════════════════════════════
   SCORE / SUBMIT
══════════════════════════════════════════════════ */
function addScore(pts, x, y, label) {
  const mult = Math.min(8, 1 + Math.floor(combo / 4));
  const final = pts * mult;
  score += final;
  combo++;
  comboTimer = 2200;
  if (label) floats.push({ x, y, text: (mult > 1 ? `×${mult} ` : "") + final, life: 1, vy: -1.6 });
}

function submit() {
  if (posted) return; posted = true;
  try { window.parent.postMessage({ type: "GAME_OVER_SCORE", score: Number(score)||0 }, "*"); } catch(_) {}
}

function gameOver() {
  running = false; submit();
  overlay.classList.remove("hidden");
  btn.textContent = "TRY AGAIN";
}

/* ══════════════════════════════════════════════════
   RESET / WAVE BUILD
══════════════════════════════════════════════════ */
function resetGame() {
  score = 0; wave = 1; lives = 3; combo = 0; comboTimer = 0;
  fireCooldown = 0; shakeT = 0; dualShot = false; dualTimer = 0;
  shielded = false; shieldTimer = 0;
  formDx = 0; formDir = 1;
  bullets = []; eBullets = []; particles = []; floats = [];
  P.x = W/2; P.y = H - 64; P.flash = 0;
  posted = false;
  buildBunkers();
  buildWave();
  running = true;
  overlay.classList.add("hidden");
  btn.textContent = "RESTART";
}

function buildBunkers() {
  bunkers = [];
  const n = 3, bw = Math.floor(W * 0.1), bh = Math.floor(H * 0.06);
  const gap = (W - n * bw) / (n + 1);
  for (let i = 0; i < n; i++) {
    const bx = gap + i * (bw + gap);
    const by = H - Math.floor(H * 0.18);
    const segs = [];
    const sw = Math.floor(bw / 5), sh = Math.floor(bh / 3);
    for (let sx = 0; sx < 5; sx++) for (let sy = 0; sy < 3; sy++) {
      // notch in bottom-center
      if (sy === 2 && (sx === 1 || sx === 2 || sx === 3)) continue;
      segs.push({ x: bx + sx*sw, y: by + sy*sh, w: sw, h: sh, hp: 3 });
    }
    bunkers.push({ segs });
  }
}

function buildWave() {
  enemies = [];
  waveIntro = 1400;

  // Formation starts slow on wave 1, ramps up with wave number
  formDx = 0; formDir = 1;
  formSpd = 0.30 + wave * 0.10;   // wave 1: 0.40, wave 5: 0.80, wave 10: 1.30
  maxEBullets = Math.min(2 + Math.floor(wave/2), 8); // wave 1: 2 bullets max, grows slowly
  const isBoss = wave % 5 === 0;
  if (isBoss) {
    // Boss wave — one large boss + escort drones
    const t = ETYPE.BOSS;
    enemies.push({
      ...t, x: W/2, y: 80, baseX: W/2, baseY: 80,
      vx: 1.4 + wave*0.06, vy: 0,
      phase: 0, hp: t.hp + wave*2,
      type: "BOSS", diving: false, diveTarget: null, fireTick: 0,
      fireRate: Math.max(600, 1400 - wave*40)
    });
    const escorts = 6;
    for (let i = 0; i < escorts; i++) {
      const t2 = ETYPE.DRONE;
      const ex = W/2 + (i - escorts/2 + 0.5) * 52;
      enemies.push({
        ...t2, x: ex, y: 160, baseX: ex, baseY: 160,
        vx: 1.4 + wave*0.09, vy: 0,
        phase: i*1.04, hp: 1,
        type: "DRONE", diving: false, diveTarget: null, fireTick: Math.random()*600,
        fireRate: Math.max(700, 1200 - wave*35)
      });
    }
    return;
  }

  // Normal wave — tight grid formation
  const rows  = Math.min(5, 2 + Math.floor(wave/2));
  const cols  = Math.min(10, 6 + Math.floor(wave/3));
  const xSep  = Math.min(58, Math.floor((W - 120) / cols));
  const ySep  = 44;
  const startX = W/2 - (cols-1)*xSep/2;
  const startY = 52;

  // Formation state already reset above
  // Wave 1: fire rate very slow (every 4-6s per enemy), grows with wave
  // Wave 5+: every ~1.5s per eligible enemy, still capped by maxEBullets
  const fireRateBase = Math.max(800, 4500 - wave * 380);

  for (let r = 0; r < rows; r++) {
    for (let col = 0; col < cols; col++) {
      let typeKey = "DRONE";
      if (r === 0) typeKey = "ELITE";
      else if (r === 1) typeKey = "GUNSHIP";
      const t = ETYPE[typeKey];
      const ex = startX + col * xSep;
      const ey = startY + r * ySep;
      enemies.push({
        ...t,
        x: ex, y: ey, baseX: ex, baseY: ey,
        phase: col * 0.4 + r * 0.9,
        type: typeKey,
        formCol: col, formRow: r,   // grid position for "front row only" fire rule
        diving: false, diveTarget: null,
        // Large initial fireTick — nobody shoots in the first few seconds
        fireTick: 3500 + Math.random() * 2000 + col * 180,
        fireRate: fireRateBase
      });
    }
  }
}

/* ══════════════════════════════════════════════════
   PARTICLES / EFFECTS
══════════════════════════════════════════════════ */
function explosion(px, py, col, n, big) {
  for (let i = 0; i < n; i++) {
    const a = Math.random()*6.28, s = (big?2:0.8) + Math.random()*(big?6:3.5);
    particles.push({ x:px, y:py, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:1, decay:0.022+Math.random()*0.02, col, r:big?3:1.8 });
  }
  if (big) {
    shakeT = 320; shakeAmt = 7;
    for (let i = 0; i < 8; i++) {
      const a = Math.random()*6.28, s = 1+Math.random()*2;
      particles.push({ x:px, y:py, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:0.6, decay:0.018, col:"#fff", r:2.5 });
    }
  }
}

function chainBolt(x1,y1,x2,y2,col) {
  particles.push({ bolt:true, x1,y1,x2,y2, life:0.22, col });
}

/* ══════════════════════════════════════════════════
   DRAW HELPERS
══════════════════════════════════════════════════ */
function drawBg(dt) {
  cx.fillStyle = "#020814";
  cx.fillRect(0, 0, W, H);

  // Nebula blobs
  for (const nb of nebula) {
    const g = cx.createRadialGradient(nb.x, nb.y, 0, nb.x, nb.y, nb.r);
    g.addColorStop(0, nb.col + "44");
    g.addColorStop(1, "transparent");
    cx.fillStyle = g;
    cx.fillRect(nb.x - nb.r, nb.y - nb.r, nb.r*2, nb.r*2);
  }

  // Stars with twinkle
  for (const s of stars) {
    s.y += s.z * 0.35;
    s.twinkle += 0.05;
    if (s.y > H) { s.y = -2; s.x = Math.random()*W; }
    const bright = 0.25 + s.z*0.28 + Math.sin(s.twinkle)*0.15;
    cx.fillStyle = `rgba(180,210,255,${bright.toFixed(2)})`;
    const sz = s.z > 1.5 ? 2 : 1;
    cx.fillRect(s.x, s.y, sz, sz);
  }
}

function drawPlayer() {
  const { x, y, flash, w, h } = P;
  if (flash > 0 && Math.floor(flash/120)%2===0) return;
  cx.save(); cx.translate(x, y);

  // Engine glow
  cx.shadowBlur = 18; cx.shadowColor = "#00f5ff";

  // Main hull
  cx.fillStyle = "#00f5ff";
  cx.beginPath();
  cx.moveTo(0, -h);
  cx.lineTo(-w/2, h/2);
  cx.lineTo(-w/4, h/4);
  cx.lineTo(0, h/2);
  cx.lineTo(w/4, h/4);
  cx.lineTo(w/2, h/2);
  cx.closePath(); cx.fill();

  // Cockpit
  cx.fillStyle = "#001a2e";
  cx.beginPath();
  cx.moveTo(0, -h*0.55);
  cx.lineTo(-w*0.18, h*0.05);
  cx.lineTo(w*0.18, h*0.05);
  cx.closePath(); cx.fill();

  // Cockpit shine
  cx.fillStyle = "rgba(180,240,255,.5)";
  cx.beginPath();
  cx.moveTo(0, -h*0.5);
  cx.lineTo(-w*0.08, -h*0.1);
  cx.lineTo(0, -h*0.05);
  cx.closePath(); cx.fill();

  // Side pods
  cx.fillStyle = "#0088bb";
  cx.fillRect(-w/2-6, h*0.1, 8, h*0.4);
  cx.fillRect( w/2-2, h*0.1, 8, h*0.4);

  // Engine flame
  const ft = Date.now()*0.008;
  cx.shadowColor = "#ff6600";
  cx.fillStyle = "#ff6600";
  cx.beginPath();
  cx.moveTo(-w*0.18, h/2);
  cx.lineTo(w*0.18, h/2);
  cx.lineTo(0, h/2 + 10 + Math.sin(ft)*5);
  cx.closePath(); cx.fill();

  cx.fillStyle = "#ffcc00";
  cx.beginPath();
  cx.moveTo(-w*0.08, h/2);
  cx.lineTo(w*0.08, h/2);
  cx.lineTo(0, h/2 + 5 + Math.sin(ft+1)*3);
  cx.closePath(); cx.fill();

  // Shield bubble
  if (shielded) {
    const sr = P.w + 10 + Math.sin(Date.now()*0.006)*3;
    cx.shadowBlur = 18; cx.shadowColor = "#6677ff";
    cx.strokeStyle = "#8899ff"; cx.lineWidth = 2.5;
    cx.globalAlpha = 0.55 + Math.sin(Date.now()*0.01)*0.15;
    cx.beginPath(); cx.arc(0, 0, sr, 0, Math.PI*2); cx.stroke();
    cx.globalAlpha = 1; cx.shadowBlur = 0;
  }

  cx.shadowBlur = 0;
  cx.restore();
}

function drawDrone(e, t) {
  cx.save(); cx.translate(e.x, e.y);
  cx.shadowBlur = 12; cx.shadowColor = t.col;

  const pulse = 0.75 + Math.sin(Date.now()*0.007 + e.phase)*0.25;
  cx.globalAlpha = pulse;

  // Body diamond
  cx.fillStyle = t.col;
  cx.beginPath();
  cx.moveTo(0,-t.r); cx.lineTo(t.r*0.8,0); cx.lineTo(0,t.r); cx.lineTo(-t.r*0.8,0);
  cx.closePath(); cx.fill();

  // Inner gem
  cx.fillStyle = t.col2;
  cx.beginPath();
  cx.moveTo(0,-t.r*0.5); cx.lineTo(t.r*0.4,0); cx.lineTo(0,t.r*0.5); cx.lineTo(-t.r*0.4,0);
  cx.closePath(); cx.fill();

  // Wing nubs
  cx.fillStyle = t.col;
  cx.fillRect(-t.r*1.2, -3, t.r*0.45, 6);
  cx.fillRect( t.r*0.75, -3, t.r*0.45, 6);

  // HP pips
  if (e.hp > 1) {
    cx.globalAlpha = 1; cx.shadowBlur = 0;
    for (let i = 0; i < e.hp; i++) {
      cx.fillStyle = t.col2;
      cx.fillRect(-t.r*0.5 + i*6, t.r+3, 4, 4);
    }
  }

  cx.globalAlpha = 1; cx.shadowBlur = 0;
  cx.restore();
}

function drawGunship(e, t) {
  cx.save(); cx.translate(e.x, e.y);
  cx.shadowBlur = 14; cx.shadowColor = t.col;

  // Main hull (hexagon-ish)
  cx.fillStyle = t.col;
  cx.beginPath();
  cx.moveTo(0, -t.r); cx.lineTo(t.r*0.7, -t.r*0.5);
  cx.lineTo(t.r*0.7, t.r*0.5); cx.lineTo(0, t.r);
  cx.lineTo(-t.r*0.7, t.r*0.5); cx.lineTo(-t.r*0.7, -t.r*0.5);
  cx.closePath(); cx.fill();

  // Center core
  cx.fillStyle = t.col2;
  cx.beginPath(); cx.arc(0, 0, t.r*0.45, 0, Math.PI*2); cx.fill();

  // Cannon barrels
  cx.fillStyle = t.col;
  cx.fillRect(-3, t.r*0.7, 6, t.r*0.5);
  cx.fillRect(-t.r*0.5-2, t.r*0.4, 4, t.r*0.4);
  cx.fillRect( t.r*0.5-2, t.r*0.4, 4, t.r*0.4);

  // HP indicator bar
  if (e.hp > 0) {
    const maxHp = ETYPE.GUNSHIP.hp;
    cx.fillStyle = "#333"; cx.fillRect(-t.r, t.r+5, t.r*2, 4);
    cx.fillStyle = t.col2; cx.fillRect(-t.r, t.r+5, t.r*2*(e.hp/maxHp), 4);
  }

  cx.shadowBlur = 0; cx.restore();
}

function drawElite(e, t) {
  cx.save(); cx.translate(e.x, e.y);
  cx.shadowBlur = 18; cx.shadowColor = t.col;
  const rot = Date.now() * 0.002 + e.phase;

  // Outer ring
  cx.strokeStyle = t.col; cx.lineWidth = 2.5;
  cx.beginPath(); cx.arc(0, 0, t.r, 0, Math.PI*2); cx.stroke();

  // Rotating inner shape
  cx.save(); cx.rotate(rot);
  cx.fillStyle = t.col;
  for (let i = 0; i < 3; i++) {
    cx.save(); cx.rotate(i * Math.PI * 2/3);
    cx.beginPath();
    cx.moveTo(0, -t.r*0.8); cx.lineTo(t.r*0.4, t.r*0.3); cx.lineTo(-t.r*0.4, t.r*0.3);
    cx.closePath(); cx.fill();
    cx.restore();
  }
  cx.restore();

  // Core
  cx.fillStyle = t.col2;
  cx.beginPath(); cx.arc(0, 0, t.r*0.3, 0, Math.PI*2); cx.fill();

  // HP pips
  for (let i = 0; i < e.hp; i++) {
    cx.fillStyle = i < e.hp ? t.col2 : "#333";
    cx.beginPath(); cx.arc(-t.r*0.6 + i*t.r*0.6, t.r+7, 3, 0, Math.PI*2); cx.fill();
  }

  cx.shadowBlur = 0; cx.restore();
}

function drawBoss(e, t) {
  cx.save(); cx.translate(e.x, e.y);
  const maxHp = t.hp + wave*2;
  const hpFrac = e.hp / maxHp;
  const pulse = 0.8 + Math.sin(Date.now()*0.005)*0.2;
  cx.shadowBlur = 28; cx.shadowColor = t.col;

  // Outer ring
  cx.strokeStyle = t.col; cx.lineWidth = 3;
  cx.beginPath(); cx.arc(0, 0, t.r, 0, Math.PI*2); cx.stroke();

  // Rotating armor plates
  cx.save(); cx.rotate(Date.now()*0.0008);
  cx.fillStyle = t.col + "88";
  for (let i = 0; i < 6; i++) {
    cx.save(); cx.rotate(i * Math.PI/3);
    cx.fillRect(-4, -t.r*0.95, 8, t.r*0.4);
    cx.restore();
  }
  cx.restore();

  // Core body
  cx.fillStyle = t.col;
  cx.globalAlpha = pulse;
  cx.beginPath(); cx.arc(0, 0, t.r*0.6, 0, Math.PI*2); cx.fill();
  cx.globalAlpha = 1;

  // Inner eye
  cx.fillStyle = "#001a0a";
  cx.beginPath(); cx.arc(0, 0, t.r*0.28, 0, Math.PI*2); cx.fill();
  cx.shadowColor = t.col2;
  cx.fillStyle = t.col2;
  cx.beginPath(); cx.arc(0, 0, t.r*0.14, 0, Math.PI*2); cx.fill();

  // Side cannons
  cx.fillStyle = "#00bb66"; cx.shadowBlur = 8;
  cx.fillRect(-t.r-10, -5, 14, 10);
  cx.fillRect( t.r-4,  -5, 14, 10);

  // Health bar
  cx.shadowBlur = 0;
  cx.fillStyle = "#222"; cx.fillRect(-t.r, t.r+10, t.r*2, 7);
  cx.fillStyle = hpFrac > 0.5 ? "#00ff88" : hpFrac > 0.25 ? "#ffcc00" : "#ff3322";
  cx.fillRect(-t.r, t.r+10, t.r*2*hpFrac, 7);
  cx.strokeStyle = t.col; cx.lineWidth = 1;
  cx.strokeRect(-t.r, t.r+10, t.r*2, 7);

  cx.restore();
}

function drawBunkers() {
  for (const bk of bunkers) {
    for (const s of bk.segs) {
      if (s.hp <= 0) continue;
      const frac = s.hp / 3;
      cx.fillStyle = `rgba(0,${Math.floor(180*frac)},${Math.floor(100*frac)},0.85)`;
      cx.fillRect(s.x, s.y, s.w, s.h);
      cx.strokeStyle = `rgba(0,255,120,${frac*0.6})`;
      cx.lineWidth = 1;
      cx.strokeRect(s.x, s.y, s.w, s.h);
    }
  }
}

function drawBullet(b) {
  cx.shadowBlur = 10; cx.shadowColor = "#ffe066";
  cx.fillStyle = "#ffe066";
  cx.fillRect(b.x-2, b.y-9, 4, 12);
  if (dualShot) {
    cx.fillStyle = "#00ffcc";
    cx.shadowColor = "#00ffcc";
    cx.fillRect(b.x-2, b.y-9, 4, 12);
  }
  cx.shadowBlur = 0;
}

function drawEBullet(b) {
  cx.shadowBlur = 8; cx.shadowColor = b.col || "#ff4466";
  cx.fillStyle = b.col || "#ff4466";
  cx.beginPath(); cx.arc(b.x, b.y, 4, 0, Math.PI*2); cx.fill();
  cx.shadowBlur = 0;
}

/* ══════════════════════════════════════════════════
   UPDATE
══════════════════════════════════════════════════ */
function update(dt) {
  const ms = Math.min(dt, 34);

  // Combo decay
  if (comboTimer > 0) { comboTimer -= ms; if (comboTimer <= 0) combo = 0; }

  // Power-up timers
  if (dualTimer  > 0) { dualTimer  -= ms; if (dualTimer  <= 0) dualShot  = false; }
  if (shieldTimer> 0) { shieldTimer-= ms; if (shieldTimer<= 0) shielded  = false; }

  // Screen shake
  if (shakeT > 0) { shakeT -= ms; }

  // Wave intro
  if (waveIntro > 0) { waveIntro -= ms; }

  // Player flash
  if (P.flash > 0) P.flash -= ms;

  /* ── Player movement ── */
  if (keys["arrowleft"] || keys["a"]) P.x -= P.speed;
  if (keys["arrowright"] || keys["d"]) P.x += P.speed;
  P.x = Math.max(28, Math.min(W-28, P.x));

  /* ── Firing ── */
  fireCooldown -= ms;
  if ((keys[" "] || keys["enter"]) && fireCooldown <= 0) {
    fireCooldown = dualShot ? 100 : 160;
    bullets.push({ x: P.x, y: P.y - P.h, vy: -(9.5 + wave*0.08) });
    if (dualShot) {
      bullets.push({ x: P.x - 14, y: P.y - P.h/2, vy: -(9.0) });
      bullets.push({ x: P.x + 14, y: P.y - P.h/2, vy: -(9.0) });
    }
  }

  /* ── Move bullets ── */
  for (const b of bullets) b.y += b.vy;
  bullets = bullets.filter(b => b.y > -20);
  for (const b of eBullets) { b.x += b.vx||0; b.y += b.vy; }
  eBullets = eBullets.filter(b => b.y < H+20 && b.x > -20 && b.x < W+20);

  /* ── Formation march (shared offset for all non-diving non-boss enemies) ── */
  const allFormEnemies = enemies.filter(e => e.type !== "BOSS");
  const formEnemies = allFormEnemies.filter(e => !e.diving);
  if (formEnemies.length > 0) {
    // Classic Space Invaders escalation: speed multiplies as enemy count drops
    // Full grid (12–30 enemies) = base speed. Last few enemies = up to 4× faster
    const startCount = (Math.min(5, 2+Math.floor(wave/2))) * (Math.min(10, 6+Math.floor(wave/3)));
    const countRatio = formEnemies.length / Math.max(1, startCount);
    const countBoost = 1 + (1 - countRatio) * 3.5; // 1× at full, up to 4.5× at last enemy
    const effectiveSpd = formSpd * countBoost;

    formDx += effectiveSpd * formDir * (ms/16);
    const minX = Math.min(...formEnemies.map(e => e.baseX + formDx));
    const maxX = Math.max(...formEnemies.map(e => e.baseX + formDx));
    if (minX < 22 || maxX > W - 22) {
      formDir *= -1;
      formDx  += formDir * 3;
      for (const e of formEnemies) {
        e.baseY += formStepY;
        if (e.baseY > H * 0.60) { gameOver(); return; }
      }
      // Slight base speed bump each wall bounce
      formSpd = Math.min(formSpd + 0.04, 3.0);
    }
  }

  /* ── Enemy update ── */
  for (const e of enemies) {
    if (e.type === "BOSS") {
      // Boss bounces independently
      e.x += e.vx * (ms/16);
      if (e.x < 60 || e.x > W-60) e.vx *= -1;
      // Phase 2 at 50% HP: speed up + extra shots
      const bossMax = ETYPE.BOSS.hp + wave*2;
      if (e.hp <= bossMax/2 && !e.phase2) {
        e.phase2 = true;
        e.vx *= 1.8;
        e.fireRate = Math.max(300, e.fireRate - 200);
        shakeT = 400; shakeAmt = 10;
        floats.push({ x:e.x, y:e.y-50, text:"PHASE 2!", life:1.8, vy:-1.4 });
      }
    } else if (e.diving) {
      // Dive toward player
      const dx = P.x - e.x, dy = (P.y - 40) - e.y;
      const dist = Math.hypot(dx, dy) || 1;
      const dspd = (3.8 + wave*0.18) * (ms/16);
      e.x += (dx/dist)*dspd;
      e.y += (dy/dist)*dspd;
      if (e.y > P.y + 30 || dist < 20) {
        e.diving = false;
        // Snap baseX to current x so it re-joins formation smoothly
        e.baseX = e.x - formDx;
        e.baseY = Math.min(e.baseY, e.y);
      }
    } else {
      // Follow shared formation offset
      e.x = e.baseX + formDx;
      // Gentle individual bob (small, keeps grid feel)
      e.y = e.baseY + Math.sin(Date.now()*0.002 + e.phase) * 5;
      // Dive trigger — much rarer on early waves
      // Wave 1: ~0.00006/frame per enemy (nearly none), wave 5: ~0.00025, wave 10+: ~0.0005
      const diveChance = 0.00004 * (1 + wave * 0.55);
      if (!e.diving && e.type !== "BOSS" && Math.random() < diveChance && e.y < H*0.52) {
        e.diving = true;
      }
    }

    // Enemy fire
    e.fireTick -= ms;
    if (e.fireTick <= 0) {
      e.fireTick = e.fireRate + Math.random() * (e.fireRate * 0.5);

      // ── Front-row-only fire rule (Space Invaders authentic) ──
      // An enemy can only fire if no other enemy is directly below it in the same column
      const isColumnFront = !enemies.some(other =>
        other !== e &&
        other.type !== "BOSS" &&
        Math.abs(other.baseX - e.baseX) < 30 &&  // same column (roughly)
        other.baseY > e.baseY                      // other is lower on screen
      );

      // Bullet cap — wave 1 max 2 enemy bullets at once
      const bulletCap = eBullets.length < maxEBullets;

      if (e.type === "BOSS") {
        // Boss ignores column rule
        const bspd = 3.5 + wave * 0.18;
        for (let a = -0.35; a <= 0.36; a += 0.175) {
          eBullets.push({ x:e.x, y:e.y+e.r, vx:Math.sin(a)*3.5, vy:bspd, col:"#00ff88" });
        }
        if (e.phase2) {
          const dx=P.x-e.x, dy=P.y-e.y, d=Math.hypot(dx,dy)||1, sp=4+wave*0.1;
          eBullets.push({ x:e.x, y:e.y+e.r, vx:(dx/d)*sp*0.5, vy:(dy/d)*sp, col:"#00ffee" });
        }
      } else if (isColumnFront && bulletCap) {
        // Bullet speed scales with wave — slow and readable early, faster later
        const bspd = 2.2 + wave * 0.22;  // wave 1: 2.44, wave 5: 3.3, wave 10: 4.4
        if (e.type === "GUNSHIP") {
          // Only spread on wave 3+, single shot before that
          if (wave >= 3) {
            for (let a = -0.18; a <= 0.19; a += 0.18) {
              eBullets.push({ x:e.x, y:e.y+e.r, vx:Math.sin(a)*2, vy:bspd, col:"#ff8c00" });
            }
          } else {
            eBullets.push({ x:e.x, y:e.y+e.r, vx:0, vy:bspd, col:"#ff8c00" });
          }
        } else if (e.type === "ELITE") {
          // Aimed only on wave 4+, straight drop before that
          if (wave >= 4) {
            const dx=P.x-e.x, dy=P.y-e.y, d=Math.hypot(dx,dy)||1;
            eBullets.push({ x:e.x, y:e.y+e.r, vx:(dx/d)*bspd*0.35, vy:bspd, col:"#aa66ff" });
          } else {
            eBullets.push({ x:e.x, y:e.y+e.r, vx:0, vy:bspd, col:"#aa66ff" });
          }
        } else {
          // Drone — straight drop always
          eBullets.push({ x:e.x, y:e.y+e.r, vx:0, vy:bspd, col:"#ff4466" });
        }
      }
    }
  }

  /* ── Bullet vs enemy ── */
  for (let bi = bullets.length-1; bi >= 0; bi--) {
    const b = bullets[bi];
    let hit = false;
    for (let ei = enemies.length-1; ei >= 0; ei--) {
      const e = enemies[ei];
      if (Math.hypot(b.x-e.x, b.y-e.y) < e.r + 3) {
        e.hp--;
        explosion(e.x, e.y, e.col, 8, false);
        bullets.splice(bi, 1);
        hit = true;
        if (e.hp <= 0) {
          const big = e.type === "BOSS";
          explosion(e.x, e.y, e.col, big?40:18, big);
          if (big) explosion(e.x, e.y, e.col2, 20, true);
          // Chain bolt to nearby enemy
          const nearby = enemies.filter((n,ni)=>ni!==ei && Math.hypot(n.x-e.x,n.y-e.y)<110);
          if (nearby.length && wave > 2) {
            const tgt = nearby[0];
            chainBolt(e.x,e.y,tgt.x,tgt.y,e.col2);
            tgt.hp -= 1;
            if (tgt.hp <= 0) {
              explosion(tgt.x,tgt.y,tgt.col,16,false);
              addScore(tgt.pts, tgt.x, tgt.y-14, true);
              enemies.splice(enemies.indexOf(tgt),1);
            }
          }
          addScore(e.pts + (e.diving ? e.pts : 0), e.x, e.y-20, true);
          // Power-up drop
          const pRoll = Math.random();
          if (e.type === "BOSS" || pRoll < 0.05) {
            dualShot = true; dualTimer = 12000;
            floats.push({ x:e.x, y:e.y, text:"⚡ DUAL SHOT!", life:1.4, vy:-1.4 });
          } else if (pRoll < 0.10 && !shielded) {
            shielded = true; shieldTimer = 8000;
            floats.push({ x:e.x, y:e.y, text:"🛡 SHIELD!", life:1.4, vy:-1.4 });
          }
          // Formation bonus: check if entire column cleared
          if (formEnemies.length > 0) {
            const colX = e.baseX;
            const colLeft = enemies.filter(en => Math.abs(en.baseX - colX) < 8);
            if (colLeft.length === 0) {
              score += 300;
              floats.push({ x:e.x, y:e.y-30, text:"COLUMN CLEAR! +300", life:1.6, vy:-1.0 });
            }
          }
          enemies.splice(ei, 1);
        }
        break;
      }
    }
    if (hit) continue;

    // Bullet vs bunker
    for (const bk of bunkers) {
      for (const s of bk.segs) {
        if (s.hp <= 0) continue;
        if (b.x > s.x && b.x < s.x+s.w && b.y > s.y && b.y < s.y+s.h) {
          s.hp--; bullets.splice(bi, 1); hit = true; break;
        }
      }
      if (hit) break;
    }
  }

  /* ── Enemy bullet vs player ── */
  if (P.flash <= 0) {
    for (const eb of eBullets) {
      if (Math.hypot(eb.x-P.x, eb.y-P.y) < 16) {
        eBullets.splice(eBullets.indexOf(eb), 1);
        if (shielded) {
          // Shield absorbs the hit
          shielded = false; shieldTimer = 0;
          shakeT = 200; shakeAmt = 4;
          explosion(P.x, P.y, "#88aaff", 14, false);
          floats.push({ x:P.x, y:P.y-30, text:"SHIELD BLOCKED!", life:1.2, vy:-1.2 });
        } else {
          lives--;
          P.flash = 1800;
          shakeT = 400; shakeAmt = 9;
          explosion(P.x, P.y, "#00f5ff", 24, true);
          if (lives <= 0) { gameOver(); return; }
        }
        break;
      }
    }
  }

  /* ── Enemy bullet vs bunker ── */
  for (let bi = eBullets.length-1; bi >= 0; bi--) {
    const eb = eBullets[bi];
    let hit = false;
    for (const bk of bunkers) {
      for (const s of bk.segs) {
        if (s.hp <= 0) continue;
        if (eb.x > s.x && eb.x < s.x+s.w && eb.y > s.y && eb.y < s.y+s.h) {
          s.hp--; eBullets.splice(bi, 1); hit = true; break;
        }
      }
      if (hit) break;
    }
  }

  /* ── Particles ── */
  for (let i = particles.length-1; i >= 0; i--) {
    const p = particles[i];
    if (p.bolt) { p.life -= ms/1000; if (p.life <= 0) particles.splice(i,1); continue; }
    p.x += p.vx; p.y += p.vy; p.vy += 0.04; p.life -= p.decay;
    if (p.life <= 0) particles.splice(i,1);
  }

  /* ── Floating text ── */
  for (let i = floats.length-1; i >= 0; i--) {
    floats[i].y += floats[i].vy; floats[i].life -= 0.018;
    if (floats[i].life <= 0) floats.splice(i,1);
  }

  /* ── Wave clear ── */
  if (enemies.length === 0) {
    wave++;
    score += 500 + wave * 80;
    buildBunkers();
    buildWave();
  }

  /* ── HUD update ── */
  const mult = Math.min(8, 1 + Math.floor(combo/4));
  hScore.textContent = "SCORE " + score;
  hWave.textContent  = "WAVE " + wave + (wave%5===0 ? " ⚠ BOSS" : "");
  hInfo.textContent  = "HULL " + "♥".repeat(Math.max(0,lives)) + "♡".repeat(Math.max(0,3-lives))
    + "  ×" + mult
    + (dualShot  ? "  ⚡DUAL" : "")
    + (shielded  ? "  🛡" : "");
}

/* ══════════════════════════════════════════════════
   RENDER
══════════════════════════════════════════════════ */
function render() {
  // Screen shake
  cx.save();
  if (shakeT > 0) {
    const s = (shakeT/400)*shakeAmt;
    cx.translate((Math.random()-0.5)*s, (Math.random()-0.5)*s);
  }

  drawBg(0);
  drawBunkers();

  // Bullets
  for (const b of bullets) drawBullet(b);
  for (const eb of eBullets) drawEBullet(eb);

  // Enemies
  for (const e of enemies) {
    if (e.type === "BOSS")    drawBoss(e, ETYPE.BOSS);
    else if (e.type === "GUNSHIP") drawGunship(e, ETYPE.GUNSHIP);
    else if (e.type === "ELITE")   drawElite(e, ETYPE.ELITE);
    else                           drawDrone(e, ETYPE.DRONE);
  }

  // Particles
  for (const p of particles) {
    if (p.bolt) {
      cx.save();
      cx.strokeStyle = p.col; cx.lineWidth = 2;
      cx.globalAlpha = Math.max(0, p.life * 4);
      cx.shadowBlur = 8; cx.shadowColor = p.col;
      cx.beginPath();
      const mx = (p.x1+p.x2)/2 + (Math.random()-0.5)*14;
      const my = (p.y1+p.y2)/2 + (Math.random()-0.5)*10;
      cx.moveTo(p.x1,p.y1); cx.lineTo(mx,my); cx.lineTo(p.x2,p.y2);
      cx.stroke();
      cx.globalAlpha = 1; cx.shadowBlur = 0;
      cx.restore();
      continue;
    }
    cx.globalAlpha = Math.max(0, p.life);
    cx.fillStyle = p.col;
    cx.shadowBlur = 4; cx.shadowColor = p.col;
    cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, Math.PI*2); cx.fill();
    cx.globalAlpha = 1; cx.shadowBlur = 0;
  }

  // Floating score text
  cx.font = "bold 13px ui-monospace,monospace";
  cx.textAlign = "center";
  for (const f of floats) {
    cx.globalAlpha = Math.max(0, f.life * 0.9);
    cx.fillStyle = "#ffe066";
    cx.shadowBlur = 8; cx.shadowColor = "#ffe066";
    cx.fillText(f.text, f.x, f.y);
  }
  cx.globalAlpha = 1; cx.shadowBlur = 0;

  drawPlayer();

  // Wave intro text
  if (waveIntro > 0) {
    const alpha = Math.min(1, waveIntro/400) * Math.min(1, (waveIntro)/200);
    cx.globalAlpha = alpha;
    cx.fillStyle = wave%5===0 ? "#00ff88" : "#00f5ff";
    cx.shadowBlur = 20; cx.shadowColor = cx.fillStyle;
    cx.font = "bold " + Math.floor(W*0.06) + "px ui-monospace,monospace";
    cx.textAlign = "center";
    cx.fillText(wave%5===0 ? "⚠ BOSS WAVE" : "WAVE " + wave, W/2, H/2 - 10);
    cx.font = "bold " + Math.floor(W*0.025) + "px ui-monospace,monospace";
    cx.fillStyle = "#a0d0ff";
    cx.fillText(wave%5===0 ? "DESTROY THE SWARM LORD" : enemies.length + " ENEMIES INCOMING", W/2, H/2 + Math.floor(W*0.038));
    cx.globalAlpha = 1; cx.shadowBlur = 0;
  }

  cx.restore(); // end shake
}

/* ══════════════════════════════════════════════════
   LOOP
══════════════════════════════════════════════════ */
function loop(ts) {
  if (!last) last = ts;
  const dt = ts - last; last = ts;
  if (running) update(dt);
  render();
  requestAnimationFrame(loop);
}

/* ── Input ── */
addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key === " ") e.preventDefault();
  if (!running && (e.key === " " || e.key === "Enter")) resetGame();
});
addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });
btn.addEventListener("click", resetGame);
addEventListener("resize", () => { resize(); if (!running) { initStars(); } });

resize();
requestAnimationFrame(loop);
})();
</script>
</body>
