name: PIXEL-NET PWA install audit
on:
  push:
    branches: [work/container-fixes-2026-10-27]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tools
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve local PIXEL-NET
        run: |
          python3 -m http.server 8765 --directory PIXEL-NET >/tmp/pixelnet-pwa-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/index.html >/dev/null && break || sleep 1; done
      - name: Test install and saved initials
        run: node PIXEL-NET/tests/pwa-install.test.cjs
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixelnet-pwa-install-evidence
          path: pwa-test-results/
          if-no-files-found: warn
