name: PIXEL-NET game health triage
on:
  push:
    branches: [audit/quarantine-broken-2026-10-31]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve arcade locally
        run: |
          python3 -m http.server 8765 --directory PIXEL-NET >/tmp/game-health.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/games.json >/dev/null && break || sleep 1; done
      - name: Run all 29 game runtime checks
        run: node PIXEL-NET/tests/game-health-triage.cjs
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-health-diagnostic
          path: game-health-evidence/
