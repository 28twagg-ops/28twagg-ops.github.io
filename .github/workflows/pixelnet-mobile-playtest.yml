name: PIXEL-NET mobile gameplay QA (10 licensed games)
on:
  push:
    branches: [qa/mobile-licensed-2026-10-31]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  touch-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and WebKit
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Serve site locally
        run: |
          python3 -m http.server 8765 --directory PIXEL-NET >/tmp/pixelnet-mobile.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/licensed/catalog.json >/dev/null && break || sleep 1; done
      - name: Tap, start, and interact with all ten games on both mobile engines
        run: node PIXEL-NET/tests/licensed-mobile-playtest.cjs
      - name: Upload screenshots and per-game failure log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pixelnet-mobile-playtest-report
          path: licensed-mobile-playtest-results/
