<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Track &amp; Field — PIXEL-NET</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;width:100%;background:#000;overflow:hidden;font-family:ui-monospace,Consolas,monospace;color:#fff}
  #game{width:100%;height:100%}
  #topbar{position:fixed;top:6px;left:6px;right:6px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:50;gap:10px}
  #hint{background:rgba(0,0,0,.7);border:1px solid rgba(93,224,255,.45);color:#a8ecff;padding:6px 10px;border-radius:4px;font-size:11px;max-width:64%;pointer-events:auto;transition:opacity .4s}
  #hint.dim{opacity:.25}
  #submit{background:#10253d;border:2px solid #5de0ff;color:#5de0ff;font:inherit;font-weight:700;padding:6px 12px;border-radius:4px;cursor:pointer;pointer-events:auto;font-size:12px}
  #submit:hover{background:#1a375a}
  #submit:disabled{opacity:.7;cursor:default}
  #startOv{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:100;cursor:pointer}
  #startOv.hidden{display:none}
  #startOv .card{background:#0b1b30;border:2px solid #5de0ff;border-radius:8px;padding:22px 28px;text-align:center;max-width:480px}
  #startOv h1{margin:0 0 8px;color:#5de0ff;font-size:22px;letter-spacing:2px}
  #startOv p{margin:6px 0;font-size:13px;color:#d9eeff}
  kbd{background:#1a375a;padding:2px 6px;border-radius:3px;font-size:11px;margin:0 1px}
</style>
</head>
<body tabindex="0">
<div id="startOv">
  <div class="card">
    <h1>TRACK &amp; FIELD (C64)</h1>
    <p>At the READY prompt, type <kbd>LOAD"*",8,1</kbd> then <kbd>RUN</kbd></p>
    <p>Sprint: alternate <kbd>A</kbd> and <kbd>D</kbd></p>
    <p>Jump / Throw: <kbd>SPACE</kbd></p>
    <p>Use the emulator menu (bottom-right) to insert controllers or auto-load if needed.</p>
    <p style="color:#5de0ff;margin-top:12px"><b>CLICK TO START</b></p>
  </div>
</div>
<div id="topbar">
  <div id="hint">LOAD"*",8,1 then RUN &nbsp;|&nbsp; Sprint: A/D &nbsp;|&nbsp; Action: SPACE</div>
  <button id="submit">SUBMIT SCORE</button>
</div>
<div id="game"></div>
<script>
  window.EJS_player = '#game';
  window.EJS_core = 'c64';
  window.EJS_gameUrl = './rom/Track__Field_1983_Konami.d64';
  window.EJS_gameName = 'Track & Field (C64)';
  window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
  window.EJS_startOnLoaded = true;
  window.EJS_color = '#5de0ff';
  window.EJS_volume = 0.45;
</script>
<script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
<script src="../_shared/emu-controls.js"></script>
</body>
</html>
