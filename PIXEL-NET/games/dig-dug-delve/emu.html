<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dig Dug — PIXEL-NET</title>
<link rel="stylesheet" href="../_shared/emu-shell.css">
<style>
  :root{ --hero:#ffdd66; --ink:#ffe99c; }
</style>
</head>
<body tabindex="0">
<div id="game"></div>

<div id="topbar">
  <div id="hint">Move: ARROWS &nbsp;|&nbsp; Pump: Z &nbsp;|&nbsp; Start: ENTER</div>
  <button id="submit">SUBMIT SCORE</button>
</div>

<div id="actions">
  <button data-act="start">START</button>
  <button data-act="select">SELECT</button>
  <button data-act="pump">PUMP (B)</button>
  <button data-act="a">A</button>
</div>

<div id="errorOv" class="hidden">
  <div class="card">
    <h1>EMULATOR COULDN'T BOOT</h1>
    <p class="msg"></p>
    <p class="tip">The NES ROM should be compatible. Check your connection to <kbd>cdn.emulatorjs.org</kbd>.</p>
  </div>
</div>

<script>
  window.EJS_player = '#game';
  window.EJS_core = 'nes';
  window.EJS_gameUrl = './rom/digdug.nes';
  window.EJS_gameName = 'Dig Dug';
  window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
  window.EJS_startOnLoaded = true;
  window.EJS_color = '#ffdd66';
  window.EJS_volume = 0.45;

  // libretro joypad: 0=B, 2=SELECT, 3=START, 8=A
  window.EMU_ACTIONS = {
    start:  { btn: 3, hold: 180, key: "Enter", code: "Enter", keyCode: 13 },
    select: { btn: 2, hold: 180, key: "Shift", code: "ShiftRight", keyCode: 16 },
    pump:   { btn: 0, hold: 160, key: "z",     code: "KeyZ", keyCode: 90 },
    a:      { btn: 8, hold: 160, key: "x",     code: "KeyX", keyCode: 88 }
  };

  // Auto-entry: press START twice to skip title / attract mode.
  window.EMU_AUTOSTART_INIT = 3200;
  window.EMU_AUTOSTART = [
    window.EMU_ACTIONS.start,
    window.EMU_ACTIONS.start
  ];
</script>
<script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
<script src="../_shared/emu-controls.js"></script>
</body>
</html>
