<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orbit Siege</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:transparent}
body{font-family:ui-monospace,Consolas,monospace;overflow:hidden;color:#e9edff}
canvas{position:absolute;inset:0;width:100%;height:100%}
#hud{position:absolute;top:0;left:0;right:0;padding:8px 10px;display:flex;justify-content:space-between;font-weight:700}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,8,18,.86)}
#overlay.hidden{display:none}
.box{background:rgba(14,14,31,.95);border:1px solid #9f7bff;padding:18px;border-radius:12px;text-align:center}
h1{margin:0 0 8px;font-size:26px;color:#9f7bff}
p{margin:6px 0;color:#cfbeff;font-size:13px}
button{margin-top:10px;padding:10px 16px;background:#130f2f;border:1px solid #9f7bff;color:#d7c6ff;cursor:pointer}
</style>
</head>
<body>
<canvas id="c" width="800" height="600"></canvas>
<div id="hud"><div id="score">SCORE 0</div><div id="ammo">CHARGES 3</div><div id="hp">CORE 5</div></div>
<div id="overlay"><div class="box"><h1>ORBIT SIEGE</h1><p>Rotate cannon ring and fire plasma bursts.</p><p>Keep raiders away from your core.</p><button id="btn">ENGAGE DEFENSE</button></div></div>
<script>
(() => {
  const c=document.getElementById("c"),x=c.getContext("2d"),overlay=document.getElementById("overlay"),btn=document.getElementById("btn");
  const scoreEl=document.getElementById("score"),ammoEl=document.getElementById("ammo"),hpEl=document.getElementById("hp");
  let w=800,h=600,cx=400,cy=300,r=160,ang=0,score=0,hp=5,charges=3,posted=false,running=false,last=0,spawn=0,reload=0;
  let shots=[],enemies=[];
  function resize(){const b=c.getBoundingClientRect();w=Math.max(520,Math.floor(b.width));h=Math.max(420,Math.floor(b.height));c.width=w;c.height=h;cx=w/2;cy=h/2;r=Math.min(w,h)*0.28;}
  function reset(){score=0;hp=5;charges=3;posted=false;running=true;spawn=0;reload=0;shots=[];enemies=[];overlay.classList.add("hidden");}
  function submit(){if(posted)return;posted=true;try{window.parent.postMessage({type:"GAME_OVER_SCORE",score:Number(score)||0},"*");}catch(_){ }}
  function end(){running=false;submit();overlay.classList.remove("hidden");btn.textContent="RE-ENGAGE";}
  function fire(){
    if(!running||charges<=0)return;
    charges--;
    const vx=Math.cos(ang)*8,vy=Math.sin(ang)*8;
    shots.push({x:cx+Math.cos(ang)*r,y:cy+Math.sin(ang)*r,vx,vy,life:90});
  }
  function addEnemy(){
    const side=(Math.random()*4)|0; let ex=0,ey=0;
    if(side===0){ex=Math.random()*w;ey=-20;}
    if(side===1){ex=w+20;ey=Math.random()*h;}
    if(side===2){ex=Math.random()*w;ey=h+20;}
    if(side===3){ex=-20;ey=Math.random()*h;}
    const dx=cx-ex,dy=cy-ey,d=Math.hypot(dx,dy)||1;
    enemies.push({x:ex,y:ey,vx:dx/d*(1.2+Math.random()*0.9),vy:dy/d*(1.2+Math.random()*0.9),hp:1});
  }
  addEventListener("keydown",e=>{
    if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")ang-=0.18;
    if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")ang+=0.18;
    if(e.key===" "||e.key==="Enter"){ if(!running) reset(); else fire(); }
  });
  btn.addEventListener("click",reset);
  function loop(ts){
    if(!last)last=ts; const dt=Math.min(34,ts-last); last=ts;
    x.fillStyle="#06060f";x.fillRect(0,0,w,h);
    x.strokeStyle="rgba(159,123,255,.2)";
    for(let i=0;i<4;i++){x.beginPath();x.arc(cx,cy,r+i*26,0,6.28);x.stroke();}
    x.fillStyle="#8ff0ff";x.beginPath();x.arc(cx,cy,24,0,6.28);x.fill();
    if(running){
      spawn+=dt; reload+=dt; if(spawn>Math.max(280,1100-score*0.2)){spawn=0;addEnemy();}
      if(reload>1300&&charges<3){reload=0;charges++;}
      for(const s of shots){s.x+=s.vx;s.y+=s.vy;s.life--;}
      shots=shots.filter(s=>s.life>0&&s.x>-50&&s.y>-50&&s.x<w+50&&s.y<h+50);
      for(const e of enemies){e.x+=e.vx;e.y+=e.vy;}
      for(let i=enemies.length-1;i>=0;i--){
        const e=enemies[i];
        for(let j=shots.length-1;j>=0;j--){
          const s=shots[j];
          if(Math.hypot(e.x-s.x,e.y-s.y)<16){enemies.splice(i,1);shots.splice(j,1);score+=30;break;}
        }
      }
      for(let i=enemies.length-1;i>=0;i--){
        if(Math.hypot(enemies[i].x-cx,enemies[i].y-cy)<28){enemies.splice(i,1);hp--; if(hp<=0)end();}
      }
    }
    for(const e of enemies){x.fillStyle="#ff5ea8";x.beginPath();x.arc(e.x,e.y,10,0,6.28);x.fill();}
    for(const s of shots){x.fillStyle="#fff089";x.fillRect(s.x-2,s.y-2,4,4);}
    const tx=cx+Math.cos(ang)*r,ty=cy+Math.sin(ang)*r;
    x.strokeStyle="#9f7bff";x.lineWidth=6;x.beginPath();x.moveTo(cx+Math.cos(ang)*(r-24),cy+Math.sin(ang)*(r-24));x.lineTo(tx,ty);x.stroke();x.lineWidth=1;
    x.fillStyle="#d8c7ff";x.beginPath();x.arc(tx,ty,12,0,6.28);x.fill();
    scoreEl.textContent="SCORE "+score; ammoEl.textContent="CHARGES "+charges; hpEl.textContent="CORE "+hp;
    requestAnimationFrame(loop);
  }
  addEventListener("resize",resize); resize(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
