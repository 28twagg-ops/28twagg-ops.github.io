name: PIXEL-NET shareable preview CDN audit
on:
  push:
    branches: [work/container-fixes-2026-10-27]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test public branch preview without deploying to Pages
        run: node PIXEL-NET/tests/shareable-preview-audit.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pixelnet-shareable-preview-audit
          path: preview-audit-results/
